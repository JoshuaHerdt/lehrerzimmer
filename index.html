// Kartengröße so wählen, dass die Spalten die Breite genau füllen (Handy: 3 Karten nebeneinander)
function fitScale(minW=118,maxW=150,gap=10){
  const v=$("menu").querySelector(".view"),w=Math.min(v.clientWidth||innerWidth,1180)-(innerWidth<860?58:80);
  const cols=Math.max(3,Math.floor((w+gap)/(minW+gap)));

}

function ring(f,label=""){const r=20,c=2*Math.PI*r;return `<span class="ring" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="${r}"/><circle class="v" cx="24" cy="24" r="${r}" stroke-dasharray="${(c*Math.max(0,Math.min(1,f))).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${label||Math.round(f*100)+"%"}</b></span>`;}
// Drei Lehrkräfte eines Decks als Fächer (Schulleitung und starke Karten zuerst)
function fan(d,sc=0.42){const ts=d.ids.filter(id=>byId(id)).map(byId).sort((a,b)=>(b.legend?1:0)-(a.legend?1:0)||b.hp-a.hp).slice(0,3);
  return `<span class="fan" style="--w:${Math.round(200*sc)}px;--h:${Math.round(280*sc)}px">${ts.map((c,i)=>`<span class="fc" style="--i:${i-(ts.length-1)/2}">${miniCard(c.id,sc)}</span>`).join("")}</span>`;}

const Menu=(()=>{
  const TABS=[["start","Start"],["spielen","Spielen"],["decks","Decks"],["packs","Packs"],["album","Album"],["regeln","Regeln"]];
  let tab="start",edit=null,lastPack=null,filt="ALL",albumF="t",showLink=false,lastW=0;
  const el=()=>$("menu");
  function open(t){tab=t||tab;document.body.classList.remove("ingame");render();}
  let wz="MINT",wmode="new",wmsg="",wbusy=false;
  const AUTH=()=>window.LZ_SITE&&window.LZ_SITE.auth;
  const zc=z=>`var(${SUBJ[z].v})`,zn=z=>ZWEIGE[z].name.split(" ")[0];
  function zweigPick(){return `<div class="zpick3">${ZWEIG_KEYS.map(z=>`<button type="button" class="zb3" data-wz="${z}" aria-pressed="${z===wz}" style="--c:${zc(z)}"><b>${esc(ZWEIGE[z].name)}</b><span><i>${esc(ZWEIGE[z].perk.name)}</i> ${esc(ZWEIGE[z].perk.text)}</span><span><i>Joker ${esc(ZWEIGE[z].joker.name)}</i> ${esc(ZWEIGE[z].joker.text)}</span></button>`).join("")}</div>`;}
  function vWelcome(){
    const A=AUTH();
    const seg=A?`<div class="seg" role="tablist">${[["new","Konto erstellen"],["login","Anmelden"],["guest","Ohne Konto"]].map(([k,l])=>`<button type="button" role="tab" data-wm="${k}" aria-selected="${wmode===k}">${l}</button>`).join("")}</div>`:"";
    const start=`<button class="btn pri big wide" data-go="wstart">Mit ${esc(zn(wz))} loslegen</button>`;
    const form=!A||wmode==="guest"?`<h2>Wähle deinen Zweig</h2><p class="lead">Du bekommst sein Startdeck geschenkt. Alle anderen Lehrkräfte sammelst du über Packs.${A?" Ohne Konto bleibt dein Fortschritt nur in diesem Browser.":""}</p>${zweigPick()}${start}`
      :wmode==="login"?`<h2>Willkommen zurück</h2><p class="lead">Deine Sammlung und Decks sind auf jedem Gerät gleich.</p>
        <form class="aform" id="loginform"><label>Name<input id="lname" autocomplete="username" maxlength="20" required></label><label>Passwort<input id="lpass" type="password" autocomplete="current-password" required></label><button class="btn pri big wide" ${wbusy?"disabled":""}>Anmelden</button></form>`
      :`<h2>Konto erstellen</h2><p class="lead">Mit Konto ist deine Sammlung gespeichert und auf jedem Gerät da. Du bekommst das Startdeck deines Zweigs, alles andere erspielst du dir.</p>
        <form class="aform" id="regform"><label>Name<input id="rname" autocomplete="username" maxlength="20" required placeholder="z. B. Joshua"></label><div class="two"><label>Passwort<input id="rpass" type="password" autocomplete="new-password" minlength="6" required placeholder="mind. 6 Zeichen"></label><label>Wiederholen<input id="rpass2" type="password" autocomplete="new-password" minlength="6" required></label></div>
        <span class="eyebrow">Dein Zweig</span>${zweigPick()}<button class="btn pri big wide" ${wbusy?"disabled":""}>Konto erstellen und loslegen</button></form>`;
    const art=CARDS.filter(c=>c.legend).slice(0,1).concat(CARDS.filter(c=>!c.legend).slice(0,2)).map(c=>c.id);
    return `<section class="welcome3"><div class="wcopy"><h1 class="wt">Lehrer<em>zimmer</em> Arena</h1><p class="tag">Das Sammelkartenspiel der FOS Holzkirchen</p>
      <span class="fan big" style="--w:110px;--h:154px">${art.map((id,i)=>`<span class="fc" style="--i:${i-1}">${miniCard(id,0.55)}</span>`).join("")}</span></div>
      <div class="panel wform">${seg}${form}${wmsg?`<p class="warn" role="alert">${esc(wmsg)}</p>`:""}</div></section>`;
  }
  function render(){
    const m=el();lastW=innerWidth;
    if(!Profile.get()){m.classList.add("noprof");m.querySelector(".tabs").innerHTML="";m.querySelector(".view").innerHTML=vWelcome();m.querySelector(".who").innerHTML="";return;}
    m.classList.remove("noprof");
    const left=packsLeft();
    m.querySelector(".tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-current="${k===tab?"page":"false"}">${ico(k)}<span>${l}</span>${k==="packs"&&left?`<i class="nb" aria-label="${left} Packs bereit">${left}</i>`:""}</button>`).join("");
    const v=m.querySelector(".view");
    v.dataset.view=tab;
    v.innerHTML=({start:vStart,spielen:vPlay,decks:vDecks,packs:vPacks,album:vAlbum,regeln:vRules}[tab]||vStart)();
    m.querySelector(".who").innerHTML=whoHTML();
  }
  function whoHTML(){const P=Profile.get(),n=Online.myName(),A=AUTH(),wins=P.stats.w+P.stats.ow,c=zc(P.zweig||activeDeck().zweig);
    const av=t=>`<span class="av" style="--c:${c}">${esc((t||"?").trim().charAt(0).toUpperCase()||"?")}</span>`;
    if(A&&A.info.account) return `<details class="me"><summary aria-label="Profil">${av(n)}<span class="nm">${esc(n||"Du")}</span></summary><div class="pop"><b>${esc(n||"Du")}</b><span class="mini">Konto · ${wins} ${wins===1?"Sieg":"Siege"}</span><span class="mini">Sammlung auf allen Geräten gespeichert</span><button class="btn" data-go="logout">${ico("out")} Abmelden</button></div></details>`;
    if(A) return `<details class="me"><summary aria-label="Profil">${av("?")}<span class="nm">Gast</span></summary><div class="pop"><b>Gast</b><span class="mini">Dein Fortschritt liegt nur in diesem Browser.</span><button class="btn pri" data-go="toaccount">${ico("save")} Konto erstellen</button></div></details>`;
    return `<span class="me plain">${av(n)}<span class="nm">${esc(n||"Du")}</span><span class="mini">${Profile.synced()?"gespeichert":"nur hier"}</span></span>`;}
  const activeDeck=()=>{const P=Profile.get();return P.decks.find(d=>d.id===P.active)||P.decks[0];};
  const packsLeft=()=>{const P=Profile.get();return P.packs.free+P.packs.bonus;};

  function vStart(){
    const P=Profile.get(),d=activeDeck(),bad=Profile.deckIssues(d),cur=P.cur,left=packsLeft(),n=AUTH()?(AUTH().info.account?Online.myName():""):Online.myName();
    const owned=CARDS.filter(c=>Profile.owns(c.id)).length,shiny=Object.keys(P.coll.s).filter(k=>P.coll.s[k]>0).length;
    const games=P.stats.w+P.stats.l+P.stats.ow+P.stats.ol,guest=AUTH()&&!AUTH().info.account;
    const banner=guest?(showLink?`<section class="panel banner"><form class="aform inline" id="linkform"><b>${ico("save")} Fortschritt sichern</b><span class="mini">Deine Sammlung wird in das Konto übernommen.</span><label>Name<input id="kname" autocomplete="username" maxlength="20" required></label><label>Passwort<input id="kpass" type="password" autocomplete="new-password" minlength="6" required placeholder="mind. 6 Zeichen"></label><div class="row"><button class="btn pri">Konto erstellen</button><button type="button" class="btn ghost2" data-go="hidelink">Später</button></div>${wmsg?`<span class="warn" role="alert">${esc(wmsg)}</span>`:""}</form></section>`
      :`<section class="banner slim">${ico("save")}<span><b>Du spielst als Gast.</b> Mit einem Konto ist deine Sammlung auf jedem Gerät da.</span><button class="btn pri" data-go="showlink">Konto erstellen</button></section>`):"";
    return `${banner}
      <section class="hero3" style="--c:${zc(d.zweig)}">
        <div class="hcopy"><span class="eyebrow">${games?"Bereit für die nächste Stunde?":"Willkommen in der Arena"}</span><h1>${n?`Hallo ${esc(n)}!`:"Los geht's!"}</h1>
          <p class="lead">${games?`Dein Deck <b>${esc(d.name)}</b> ist ${bad.length?"noch nicht spielbereit.":"spielbereit."}`:"Spiel deine erste Partie gegen den Computer. Das Spiel zeigt dir dabei Schritt für Schritt, was du tun kannst."}</p>
          <div class="cta">${cur?`<button class="btn pri big" data-go="resume">${ico("online")} Online-Partie fortsetzen</button>`:""}<button class="btn ${cur?"":"pri"} big" data-go="ai">${ico("bot")} Gegen den Computer</button><button class="btn big light" data-tab="spielen">${ico("online")} Online spielen</button></div></div>
        <button class="deckshow" data-tab="decks" aria-label="Aktives Deck ${esc(d.name)}, zu den Decks">${fan(d,0.5)}<span class="dl"><b>${esc(d.name)}</b><span>${esc(ZWEIGE[d.zweig].name)} · ${bad.length?'<em class="warn">unvollständig</em>':'<em class="ok">spielbereit</em>'}</span></span></button>
      </section>
      <section class="quick">
        <button class="qc ${left?"ready":""}" data-tab="packs">${packArt("sm")}<span class="qt"><b>${left?`${left} ${left===1?"Pack":"Packs"} bereit`:"Keine Packs übrig"}</b><span>${left?"Jetzt öffnen":"Morgen gibt es 2 neue · jeder Sieg +1"}</span></span></button>
        <button class="qc" data-tab="album">${ring(owned/CARDS.length,`${owned}`)}<span class="qt"><b>${owned} von ${CARDS.length} Lehrkräften</b><span>${shiny} Shiny · Album ansehen</span></span></button>
        <div class="qc stats"><div><b>${P.stats.w}</b><span>Siege gegen<br>den Computer</span></div><div><b>${P.stats.ow}</b><span>Online-<br>Siege</span></div><div><b>${Online.peers()}</b><span>gerade<br>online</span></div></div>
      </section>
      ${games?"":`<section class="panel howto"><h2>In 30 Sekunden erklärt</h2><ol class="steps"><li><i>1</i><b>Lehrkraft spielen</b><span>Ziehe eine Lehrkraft aus deiner Hand aufs Feld.</span></li><li><i>2</i><b>Energie anlegen</b><span>Einmal pro Zug: der goldene Blitz-Knopf.</span></li><li><i>3</i><b>Angreifen</b><span>Tippe deine aktive Lehrkraft an und wähle eine Attacke.</span></li></ol><p class="mini">Wer zuerst 3 Lehrkräfte in den Feierabend schickt, gewinnt. <button class="linkb" data-tab="regeln">Alle Regeln</button></p></section>`}`;
  }

  // Deck als Kachel: Fächer der stärksten Lehrkräfte, Zweigfarbe, Status
  function deckTile(d,act){const P=Profile.get(),bad=Profile.deckIssues(d),on=d.id===P.active;
    return `<div class="dtile ${on?"on":""}" style="--c:${zc(d.zweig)}">
      <button class="dcov" data-pickdeck="${esc(d.id)}" aria-pressed="${on}" aria-label="${esc(d.name)} als aktives Deck wählen">${fan(d,0.34)}${on?'<span class="act">✓ Aktiv</span>':""}</button>
      <div class="dinf"><b>${esc(d.name)}</b><span>${esc(ZWEIGE[d.zweig].name)}${d.start?" · Startdeck":""}</span>${bad.length?`<span class="warn">${esc(bad[0])}</span>`:'<span class="ok">Spielbereit</span>'}</div>
      ${act?`<div class="dact"><button class="btn sm" data-edit="${esc(d.id)}">${ico("edit")} ${d.start?"Kopieren":"Bearbeiten"}</button>${d.start?"":`<button class="btn sm ghost2" data-del="${esc(d.id)}">Löschen</button>`}</div>`:""}</div>`;}
  function vPlay(){
    const P=Profile.get(),d=activeDeck(),bad=Profile.deckIssues(d);
    return `<section class="panel"><div class="phead"><h2>Mit welchem Deck?</h2><button class="linkb" data-tab="decks">Decks verwalten</button></div>
        <div class="dscroll">${P.decks.map(x=>deckTile(x,false)).join("")}</div>${bad.length?`<p class="warn">${esc(bad[0])} <button class="linkb" data-tab="decks">Deck reparieren</button></p>`:""}</section>
      <section class="modes">
        <div class="panel mode"><span class="mico">${ico("bot")}</span><h2>Gegen den Computer</h2><p class="lead">Üben ohne Druck. Der Computer spielt einen zufälligen Zweig. Jeder Sieg bringt 1 Bonus-Pack.</p><button class="btn pri big wide" data-go="ai" ${bad.length?"disabled":""}>Partie starten</button></div>
        <div class="panel mode" id="onlinepanel">${Online.panelHTML(bad.length>0)}</div>
      </section>`;
  }

  function vDecks(){
    const P=Profile.get();
    if(edit) return deckEditor();
    return `<section class="panel"><div class="phead"><div><h2>Deine Decks</h2><p class="mini">Tippe ein Deck an, um damit zu spielen.</p></div><button class="btn pri" data-go="newdeck" ${P.decks.length>=10?"disabled":""}>${ico("plus")} Neues Deck</button></div>
      <div class="dgrid">${P.decks.map(d=>deckTile(d,true)).join("")}</div>
      <details class="more"><summary>Wie baue ich ein Deck?</summary><p>Ein Deck hat <b>10 verschiedene Lehrkräfte</b> (mindestens ${RULES.zweigMin} aus deinem Zweig, höchstens 1 Schulleitung) und <b>5 Unterstützungskarten</b> (jede höchstens 2×). Du kannst nur Karten aus deiner Sammlung einbauen. Neue Karten bekommst du aus Packs.</p></details></section>`;
  }
  function deckEditor(){
    const d=edit,ts=d.ids.filter(id=>byId(id)),ss=d.ids.filter(id=>!byId(id)),bad=Profile.deckIssues(d);
    const own=ts.filter(id=>byId(id).subj===d.zweig).length,sc=fitScale(112,140);
    const list=CARDS.filter(c=>filt==="ALL"||c.subj===filt||(filt==="OWN"&&c.subj===d.zweig)).sort((a,b)=>(Profile.owns(b.id)?1:0)-(Profile.owns(a.id)?1:0));
    const chips=[["ALL","Alle"],["OWN","Mein Zweig"],...Object.entries(SUBJ).filter(([k])=>CARDS.some(c=>c.subj===k)).map(([k,s])=>[k,s.label])];
    const meter=(l,h,a,ok)=>`<span class="meter ${ok?"ok":""}"><b>${h}/${a}</b><span>${l}</span></span>`;
    return `<section class="panel editor" style="--c:${zc(d.zweig)}">
      <div class="edbar"><div class="edtop"><button class="btn sm ghost2" data-go="cancelEdit">Abbrechen</button><input id="dname" maxlength="28" value="${esc(d.name)}" aria-label="Name des Decks"><button class="btn pri sm" data-go="saveDeck" ${bad.length?"disabled":""}>Speichern</button></div>
        <div class="meters">${meter("Lehrkräfte",ts.length,10,ts.length===10)}${meter("aus "+zn(d.zweig),own,RULES.zweigMin+"+",own>=RULES.zweigMin)}${meter("Unterstützer",ss.length,5,ss.length===5)}</div>
        <p class="status ${bad.length?"warn":"ok"}">${bad.length?esc(bad[0]):"Deck ist spielbereit. Speichern nicht vergessen!"}</p></div>
      <h3>Zweig</h3>
      <div class="zpick3 small">${ZWEIG_KEYS.map(z=>`<button type="button" class="zb3" data-dz="${z}" aria-pressed="${z===d.zweig}" style="--c:${zc(z)}"><b>${esc(ZWEIGE[z].name)}</b><span><i>${esc(ZWEIGE[z].perk.name)}</i> · Joker ${esc(ZWEIGE[z].joker.name)}</span></button>`).join("")}</div>
      <h3>Lehrkräfte <span class="mini">Tippen zum Hinzufügen oder Entfernen</span></h3>
      <div class="chips hs">${chips.map(([k,l])=>`<button class="chipb" data-f="${k}" aria-pressed="${filt===k}">${esc(l)}</button>`).join("")}</div>
      <div class="cg fit">${list.map(c=>{const on=ts.includes(c.id),ow=Profile.owns(c.id);return `<button class="pk ${on?"on":""} ${ow?"":"locked"}" data-pick="${c.id}" ${ow?"":"disabled"} aria-pressed="${on}" aria-label="${esc(c.name)}${ow?"":" (fehlt in deiner Sammlung)"}">${miniCard(c.id,sc)}${on?'<span class="badge2">✓ Im Deck</span>':""}${ow?"":'<span class="lockq">?</span>'}</button>`;}).join("")}</div>
      <h3>Unterstützungskarten <span class="mini">bis zu 2× dieselbe</span></h3>
      <div class="cg fit">${SUPPORTS.map(s=>{const n=ss.filter(x=>x===s.id).length,o=Profile.supOwned(s.id);return `<div class="pk ${n?"on":""} ${o?"":"locked"}">${miniCard(s.id,sc)}<div class="step"><button class="btn sm" data-sup="${s.id}" data-d="-1" ${n?"":"disabled"} aria-label="${esc(s.name)} weniger">−</button><b>${n}</b><button class="btn sm" data-sup="${s.id}" data-d="1" ${n>=Math.min(2,o)||ss.length>=5?"disabled":""} aria-label="${esc(s.name)} mehr">+</button></div><span class="have">${o}× in Sammlung</span></div>`;}).join("")}</div></section>`;
  }

  function vPacks(){
    const P=Profile.get(),left=packsLeft();
    const nm=b=>b.k==="e"?ENERGIES.find(e=>e.id===b.id).name:b.k==="sup"?supById(b.id).name:byId(b.id).name+(b.k==="s"?" (Shiny)":"");
    const best=P.best.length?`<div class="best"><span class="eyebrow">Deine besten Funde</span><div class="chips">${P.best.map(b=>`<span class="chip"><b>${esc(b.tag)}</b> ${esc(nm(b))}</span>`).join("")}</div></div>`:"";
    if(lastPack){
      const sc=Math.min(0.8,fitScale(96,160,10));
      const tagOf=x=>x.tag?`<span class="tag">${esc(x.tag)}</span>`:x.isNew?'<span class="tag new">Neu</span>':"";
      const face=x=>x.k==="e"?energyCard(ENERGIES.find(e=>e.id===x.id),sc):miniCard(x.id,sc,{shiny:x.k==="s"});
      const closed=lastPack.filter(x=>!x.open).length;
      return `<section class="panel reveal"><div class="phead"><h2>${closed?"Tippe die Karten an":"Dein Pack"}</h2>${closed?`<button class="btn" data-go="allopen">Alle aufdecken</button>`:""}</div>
        <div class="stage5" style="--w:${Math.round(200*sc)}px;--h:${Math.round(280*sc)}px">${lastPack.map((x,i)=>x.open?`<div class="flip revealed ${x.tag&&x.tag!=="Selten"?"glow":""}">${tagOf(x)}${face(x)}</div>`:`<button class="flip" data-flip="${i}" aria-label="Karte ${i+1} aufdecken"><span class="backside"><span>Lehrer<em>zimmer</em></span></span></button>`).join("")}</div>
        ${closed?"":`<div class="row center">${left?`<button class="btn pri big" data-go="pack">Nächstes Pack öffnen (${left})</button>`:""}<button class="btn big ${left?"":"pri"}" data-go="packdone">${left?"Fertig":"Zurück"}</button><button class="btn big light" data-tab="album">Ins Album</button></div>`}</section>`;
    }
    return `<section class="panel packs3"><div class="packhero">
        <button class="packbtn" data-go="pack" ${left?"":"disabled"} aria-label="${left?"Pack öffnen":"Keine Packs übrig"}">${packArt(left?"lg":"lg empty")}${left?`<span class="pcount">${left}</span>`:""}</button>
        <div class="pinfo"><h2>${left?`${left} ${left===1?"Pack":"Packs"} bereit`:"Alle Packs geöffnet"}</h2>
          <p class="lead">${left?"Tippe auf das Pack, um es zu öffnen.":"Morgen gibt es 2 neue Gratis-Packs. Jeder Sieg bringt sofort 1 Bonus-Pack."}</p>
          <div class="chips"><span class="chip">${P.packs.free} gratis heute</span><span class="chip">${P.packs.bonus} Bonus</span><span class="chip">${P.packs.opened} geöffnet</span></div>
          ${left?`<button class="btn pri big" data-go="pack">Pack öffnen</button>`:`<button class="btn pri big" data-go="ai">Partie spielen</button>`}
          <details class="more"><summary>Was ist in einem Pack?</summary><p>5 Karten: 3 Lehrkräfte, 1 Unterstützungskarte und 1 Glückskarte. Die Glückskarte kann eine Schulleitung (4 %), eine Shiny-Karte (7 %) oder eine Shiny-Schulleitung (1 %) sein, sonst eine Lehrkraft oder ein Energie-Motiv. Neue Lehrkräfte kannst du sofort in Decks einbauen.</p></details></div></div>${best}</section>`;
  }
  function vAlbum(){
    const P=Profile.get(),c=P.coll,cnt=o=>Object.keys(o).filter(k=>o[k]>0).length;
    const total=CARDS.length*2+SUPPORTS.length+ENERGIES.length,have=cnt(c.t)+cnt(c.s)+cnt(c.sup)+cnt(c.e);
    const sec=[["t","Lehrkräfte",cnt(c.t),CARDS.length],["s","Shiny",cnt(c.s),CARDS.length],["sup","Unterstützer",cnt(c.sup),SUPPORTS.length],["e","Energie",cnt(c.e),ENERGIES.length]];
    const sc=fitScale(104,150);
    const cell=(html,n,z)=>n?`<button class="ac" data-zoom="${z}" aria-label="Karte groß ansehen">${html}${n>1?`<span class="cnt">×${n}</span>`:""}</button>`:`<div class="ac locked">${html}<span class="lockq">?</span></div>`;
    let grid="";
    if(albumF==="t") grid=CARDS.map(x=>cell(miniCard(x.id,sc),c.t[x.id],"t:"+x.id)).join("");
    if(albumF==="s") grid=CARDS.map(x=>cell(miniCard(x.id,sc,{shiny:true}),c.s[x.id],"s:"+x.id)).join("");
    if(albumF==="sup") grid=SUPPORTS.map(x=>cell(miniCard(x.id,sc),c.sup[x.id],"sup:"+x.id)).join("");
    if(albumF==="e") grid=ENERGIES.map(x=>cell(energyCard(x,sc),c.e[x.id],"e:"+x.id)).join("");
    return `<section class="panel"><div class="ahead">${ring(have/total)}<div><h2>Sammelalbum</h2><p class="mini">${have} von ${total} Karten gesammelt · ${P.packs.opened} Packs geöffnet</p><div class="bar2"><i style="width:${(100*have/total).toFixed(1)}%"></i></div></div></div>
      <div class="chips hs seg2">${sec.map(([k,l,h,a])=>`<button class="chipb" data-af="${k}" aria-pressed="${albumF===k}">${l} <span class="n">${h}/${a}</span></button>`).join("")}</div>
      <p class="mini">Tippe eine Karte an, um sie groß zu sehen.</p>
      <div class="cg fit album">${grid}</div></section>`;
  }
  function vRules(){
    const zt=ZWEIG_KEYS.map(z=>{const Z=ZWEIGE[z];return `<div class="zr" style="--c:${zc(z)}"><b>${esc(Z.name)}</b><p><i>${esc(Z.perk.name)}</i> ${esc(Z.perk.text)}</p><p><i>Joker ${esc(Z.joker.name)}</i> ${esc(Z.joker.text)}</p></div>`;}).join("");
    const cyc=["MINT","GES","WIR","FS","DEU","MINT"].map(k=>`<span class="s" style="--c:var(${SUBJ[k].v})">${SUBJ[k].label}</span>`).join('<span class="ar">→</span>');
    return `<section class="panel rules3"><h2>So geht's</h2>
      <ol class="steps big"><li><i>1</i><b>Ziel</b><span>Schicke 3 gegnerische Lehrkräfte in den Feierabend. Jeder Feierabend bringt 5 Punkte, wer zuerst 15 hat, gewinnt.</span></li>
        <li><i>2</i><b>Vorbereiten</b><span>Ziehe 1 Karte. Dann beliebig: 1 Lehrkraft auf die Bank, 1 Unterstützungskarte (Wirtschaft: 2), 1 Energie anlegen, 1× Rückzug, Joker (1× pro Spiel).</span></li>
        <li><i>3</i><b>Angreifen</b><span>Die aktive Lehrkraft zahlt die Energie der Attacke. Damit endet dein Zug.</span></li></ol>
      <p class="mini">Der Startspieler darf im ersten Zug weder angreifen noch Unterstützer oder Joker spielen.</p>
      <h3>Schwächen</h3><p class="cyc">${cyc}</p><p>Gegen die Gruppe rechts daneben macht eine Lehrkraft +${RULES.weakBonus} Schaden.</p>
      <h3>Die 4 Zweige</h3><div class="zrules">${zt}</div>
      <details class="more"><summary>Besondere Regeln</summary><ul><li><b>Neue Hand:</b> Zu Beginn darfst du einmal deine ganze Starthand abwerfen und komplett neu ziehen.</li><li><b>Heldenkarte:</b> Gegnerische Unterstützer und Joker wirken nicht auf die Schulleitung.</li><li><b>Sonderkarten:</b> ${SUPPORTS.filter(s=>s.gwent).map(s=>esc(s.name)).join(", ")}.</li></ul></details>
      <details class="more"><summary>Online spielen</summary>${window.LZ_SITE?`<p>Schick den Link dieser Seite an deine Mitspielerinnen und Mitspieler. Wer eine Herausforderung erstellt, wartet unter „Spielen“. Die anderen sehen sie dort und treten bei.</p>`:`<p>Mitspielerinnen und Mitspieler brauchen einen claude.ai-Zugang zu dieser Seite. Lade sie über „Teilen“ per E-Mail mit dem Recht <b>Bearbeiten</b> ein (ohne öffentlichen Link). Dann sehen sie deine Herausforderung unter „Spielen“. Bitte die Echtnamen nur mit Einverständnis der Lehrkräfte teilen.</p>`}</details>
      <p><a href="https://claude.ai/artifact/JnYEqSzdzPNuHWdzYJpfen#regeln" target="_blank" rel="noopener">Ausführliche Regeln und Spieltest-Zahlen</a></p></section>`;
  }
  // Karte groß ansehen (Album)
  function zoom(key){const [k,id]=key.split(":"),sc=Math.min(1.7,(innerWidth-48)/200,(innerHeight-120)/280);
    const html=k==="e"?energyCard(ENERGIES.find(e=>e.id===id),sc):miniCard(id,sc,{shiny:k==="s"});
    const z=document.createElement("div");z.className="mzoom";z.setAttribute("role","dialog");z.setAttribute("aria-label","Karte");z.innerHTML=`${html}<button class="btn" data-go="zoomclose">Schließen</button>`;
    z.addEventListener("click",()=>z.remove());el().appendChild(z);}
  addEventListener("resize",()=>{clearTimeout(lastW._t);const t=setTimeout(()=>{if(Math.abs(innerWidth-lastW)>40&&!document.body.classList.contains("ingame")&&Profile.get()&&["album","packs","decks"].includes(tab)){const y=el().querySelector(".view").scrollTop;if(edit&&$("dname"))edit.name=$("dname").value;render();el().querySelector(".view").scrollTop=y;}},180);lastW._t=t;});

  /* Eingaben im Menü */
  function onClick(e){
    const P=Profile.get(),t=e.target;
    el().querySelectorAll("details.me[open]").forEach(d=>{if(!d.contains(t))d.open=false;});
    const wm=t.closest("[data-wm]");if(wm){wmode=wm.dataset.wm;wmsg="";render();return;}
    const wzb=t.closest("[data-wz]");if(wzb){wz=wzb.dataset.wz;const keep=[...el().querySelectorAll("input")].map(i=>[i.id,i.value]);render();keep.forEach(([id,v])=>{if($(id))$(id).value=v;});return;}
    const tb=t.closest("[data-tab]");if(tb){tab=tb.dataset.tab;edit=null;if(tab!=="packs")lastPack=null;render();el().querySelector(".view").scrollTop=0;return;}
    const pd=t.closest("[data-pickdeck]");if(pd){P.active=pd.dataset.pickdeck;Profile.save();render();return;}
    const zm=t.closest("[data-zoom]");if(zm){zoom(zm.dataset.zoom);return;}
    const go=t.closest("[data-go]")?.dataset.go;
    if(go==="ai"){const d=activeDeck();if(Profile.deckIssues(d).length){tab="decks";render();return;}Game.startAI(d.ids.slice(),d.zweig);return;}
    if(go==="resume"){Online.resume();return;}
    if(go==="wstart"){Profile.create(wz);Profile.flush();tab="start";render();return;}
    if(go==="logout"){AUTH().logout().then(()=>location.reload());return;}
    if(go==="toaccount"||go==="showlink"){tab="start";showLink=true;render();$("kname")?.focus();return;}
    if(go==="hidelink"){showLink=false;wmsg="";render();return;}
    if(go==="pack"){if(!packsLeft())return;if(P.packs.free>0)P.packs.free--;else P.packs.bonus--;lastPack=openPack();Profile.save();tab="packs";render();el().querySelector(".view").scrollTop=0;return;}
    if(go==="packdone"){lastPack=null;render();return;}
    if(go==="allopen"){lastPack.forEach(x=>x.open=true);render();return;}
    if(go==="newdeck"){edit={id:"d"+Date.now(),name:"Neues Deck",zweig:activeDeck().zweig,ids:[]};render();el().querySelector(".view").scrollTop=0;return;}
    if(go==="cancelEdit"){edit=null;render();return;}
    if(go==="saveDeck"){edit.name=($("dname").value||"Mein Deck").slice(0,28);const k=P.decks.findIndex(d=>d.id===edit.id);if(k>=0)P.decks[k]=edit;else P.decks.push(edit);P.active=edit.id;edit=null;Profile.save();render();return;}
    if(go&&Online.handle(go,activeDeck())) return;
    const fl=t.closest("[data-flip]");if(fl){lastPack[+fl.dataset.flip].open=true;render();return;}
    const af=t.closest("[data-af]");if(af){albumF=af.dataset.af;render();return;}
    const ac=t.closest("[data-activate]");if(ac){P.active=ac.dataset.activate;Profile.save();render();return;}
    const ed=t.closest("[data-edit]");if(ed){const d=P.decks.find(x=>x.id===ed.dataset.edit);edit=JSON.parse(JSON.stringify(d));if(d.start){edit.id="d"+Date.now();edit.name=d.name.replace("Startdeck","Mein");delete edit.start;}render();el().querySelector(".view").scrollTop=0;return;}
    const dl=t.closest("[data-del]");if(dl){if(dl.dataset.confirm){P.decks=P.decks.filter(d=>d.id!==dl.dataset.del);if(P.active===dl.dataset.del)P.active=P.decks[0].id;Profile.save();render();}else{dl.dataset.confirm="1";dl.textContent="Wirklich löschen?";}return;}
    if(edit){
      const dz=t.closest("[data-dz]");if(dz){edit.zweig=dz.dataset.dz;edit.name=$("dname").value;const y=el().querySelector(".view").scrollTop;render();el().querySelector(".view").scrollTop=y;return;}
      const f=t.closest("[data-f]");if(f){filt=f.dataset.f;edit.name=$("dname").value;const y=el().querySelector(".view").scrollTop;render();el().querySelector(".view").scrollTop=y;return;}
      const pk=t.closest("[data-pick]");if(pk){const id=pk.dataset.pick,ts=edit.ids.filter(x=>byId(x));edit.name=$("dname").value;
        if(edit.ids.includes(id)) edit.ids=edit.ids.filter(x=>x!==id); else if(ts.length<10) edit.ids.push(id);
        const y=el().querySelector(".view").scrollTop;render();el().querySelector(".view").scrollTop=y;return;}
      const sp=t.closest("[data-sup]");if(sp){const id=sp.dataset.sup,d=+sp.dataset.d;edit.name=$("dname").value;
        if(d>0) edit.ids.push(id); else {const k=edit.ids.lastIndexOf(id);if(k>=0)edit.ids.splice(k,1);}
        const y=el().querySelector(".view").scrollTop;render();el().querySelector(".view").scrollTop=y;return;}
    }
  }
  async function onSubmit(e){
    e.preventDefault();const A=AUTH();if(!A||wbusy)return;
    const f=e.target.id;let r=null;wmsg="";wbusy=true;
    if(f==="regform"){if($("rpass").value!==$("rpass2").value){wbusy=false;wmsg="Die Passwörter sind nicht gleich.";render();return;}
      r=await A.register($("rname").value,$("rpass").value);if(r.ok){Profile.create(wz);await Profile.flush();location.reload();return;}}
    if(f==="loginform"){r=await A.login($("lname").value,$("lpass").value);if(r.ok){location.reload();return;}}
    if(f==="linkform"){r=await A.register($("kname").value,$("kpass").value);if(r.ok){await Profile.flush();location.reload();return;}}
    const keep=[...el().querySelectorAll("input")].map(i=>[i.id,i.value]);
    wbusy=false;wmsg=r&&r.error||"";render();keep.forEach(([id,v])=>{if($(id)&&!/pass/.test(id))$(id).value=v;});
  }
  return {open,render,onClick,onSubmit,activeDeck,refreshOnline:()=>{if(!Profile.get())return;if(tab==="spielen"&&$("onlinepanel"))$("onlinepanel").innerHTML=Online.panelHTML(Profile.deckIssues(activeDeck()).length>0);if(tab==="start"&&!showLink)render();else el().querySelector(".who").innerHTML=whoHTML();}};
})();

/* ---------- Online: Lobby (db), Live-Kanal (room), Züge im Gleichschritt ---------- */
const Online=(()=>{
  let db=null,room=null,user=null,myId=null,myNameStr="",ready=false,lobby=[],peers=0,here=null,names={},waiting=null,msg="",busy=false;
  const T_OPEN=30*60*1000;
  async function init(){
    try{[db,room,user]=await Promise.all([claude.use("db"),claude.use("room"),claude.use("user")]);}catch(e){}
    if(user){try{myId=await user.id();myNameStr=await user.name();}catch(e){}}
    if(window.LZ_SITE&&myId){try{const n=localStorage.getItem("lz-site-name");if(n)myNameStr=n;}catch(e){}}
    ready=!!(db&&myId);
    if(room){try{room.presence({s:"menu"});room.onPeers(c=>{const v=c.peers.filter(p=>p.kind==="viewer");peers=v.length;if(window.LZ_SITE)here=new Set(v.map(p=>p.by));Menu.refreshOnline();},()=>{});}catch(e){}}
    if(ready){
      db.collection("lobby").onSnapshot(s=>{lobby=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(window.LZ_SITE)sweepOld();resolveNames();check();Menu.refreshOnline();},()=>{ready=false;Menu.refreshOnline();});
    }
    return {db,uid:myId};
  }
  async function resolveNames(){
    if(!user) return;const ids=[...new Set(lobby.flatMap(l=>[l.host,l.guest]).filter(Boolean))].filter(id=>!(id in names));
    if(!ids.length) return;try{const ps=await user.profiles(ids);ids.forEach(id=>names[id]=(ps[id]&&ps[id].name)||"Mitspieler");Menu.refreshOnline();}catch(e){}
  }
  // Partien, die älter als 6 Stunden sind, räumt die Webseite weg: erst die Züge, dann den Lobby-Eintrag
  const swept=new Set();
  function sweepOld(){lobby.filter(l=>!swept.has(l.id)&&Date.now()-(l.t||0)>6*3600e3+10*60e3).slice(0,10).forEach(l=>{swept.add(l.id);
    db.collection("matches").doc(l.id).delete().catch(()=>{}).then(()=>db.collection("lobby").doc(l.id).delete()).catch(()=>{});});}
  const nameOf=id=>id===myId?(myNameStr||"Du"):(names[id]||"Mitspieler");
  // Auf der Webseite zählen fremde Herausforderungen nur, solange der Ersteller noch online ist
  const open=()=>lobby.filter(l=>l.st==="open"&&Date.now()-(l.t||0)<T_OPEN&&(!here||l.host===myId||here.has(l.host)));
  function status(){return !ready?"nicht verfügbar":`${peers||1} online · ${open().filter(l=>l.host!==myId).length} offene Herausforderungen`;}
  function panelHTML(deckBad){
    const head=`<span class="mico">${ico("online")}</span><h2>Online${ready?` <span class="pill live">${peers||1} online</span>`:""}</h2>`;
    if(!ready&&window.LZ_SITE) return `${head}<p class="lead">${window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey?"Keine Verbindung zum Spielserver. Prüfe dein Internet und lade die Seite neu.":"Der Online-Modus wird gerade eingerichtet. Gegen den Computer kannst du schon spielen."}</p>`;
    if(!ready) return `${head}<p class="lead">Online-Partien brauchen einen angemeldeten claude.ai-Zugang mit Bearbeitungsrecht für diese Seite. Wer das hat, sieht hier offene Herausforderungen.</p><p class="mini">Einladen: „Teilen“ oben rechts, Person per E-Mail mit „Bearbeiten“ hinzufügen.</p>`;
    const mine=open().find(l=>l.host===myId),others=open().filter(l=>l.host!==myId);
    return `${head}
      ${mine?`<p class="lead wait"><span class="spin" aria-hidden="true"></span> Warte auf einen Gegner … Deine Herausforderung (${esc(ZWEIGE[mine.hz].name)}) sehen alle, die gerade online sind.</p><button class="btn big wide" data-go="cancelChallenge">Zurückziehen</button>`
        :`<p class="lead">Spiel live gegen deine Klasse. Dein aktives Deck wird benutzt.</p><div class="row"><button class="btn pri big" data-go="challenge" ${deckBad||busy?"disabled":""}>Herausforderung erstellen</button><button class="btn big" data-go="quick" ${deckBad||busy||!others.length?"disabled":""}>Schnell beitreten</button></div>`}
      <h3>Offene Herausforderungen</h3>${others.length?`<ul class="lob">${others.map(l=>`<li><span class="dot" style="--c:var(${SUBJ[l.hz].v})"></span><b>${esc(nameOf(l.host))}</b><span class="mini">${esc(ZWEIGE[l.hz].name)} · vor ${Math.max(1,Math.round((Date.now()-l.t)/60000))} Min.</span><button class="btn" data-go="join:${esc(l.id)}" ${deckBad||busy?"disabled":""}>Beitreten</button></li>`).join("")}</ul>`:'<p class="mini">Gerade keine. Erstelle selbst eine.</p>'}
      ${msg?`<p class="warn">${esc(msg)}</p>`:""}`;
  }
  const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  function handle(go,deck){
    if(go==="challenge"){challenge(deck);return true;}
    if(go==="cancelChallenge"){const m=open().find(l=>l.host===myId);if(m)db.collection("lobby").doc(m.id).delete().catch(()=>{});return true;}
    if(go==="quick"){const o=open().filter(l=>l.host!==myId).sort((a,b)=>a.t-b.t)[0];if(o)join(o.id,deck);return true;}
    if(go.startsWith("join:")){join(go.slice(5),deck);return true;}
    return false;
  }
  async function challenge(deck){
    busy=true;msg="";Menu.refreshOnline();
    try{const mid=rid();await db.collection("lobby").doc(mid).set({mid,host:myId,hz:deck.zweig,hd:deck.ids,st:"open",t:Date.now(),seed:Math.floor(Math.random()*2e9)});waiting=mid;}
    catch(e){msg="Die Herausforderung konnte nicht gespeichert werden. Hast du Bearbeitungsrecht für diese Seite?";}
    busy=false;Menu.refreshOnline();
  }
  async function join(id,deck){
    busy=true;msg="";Menu.refreshOnline();
    try{
      const ref=db.collection("lobby").doc(id),a=await ref.acquire({holder:myId,ttlMs:5000});
      if(!a.acquired){msg="Jemand anderes tritt gerade bei.";}
      else{const s=await ref.get(),d=s.exists&&s.data();
        if(!d||d.st!=="open"){msg="Diese Herausforderung ist schon vergeben.";}
        else{await ref.update({st:"taken",guest:myId,gz:deck.zweig,gd:deck.ids,tt:Date.now()});start(Object.assign({id},d,{guest:myId,gz:deck.zweig,gd:deck.ids}),1);}}
    }catch(e){msg="Beitreten hat nicht geklappt. Versuch es noch einmal.";}
    busy=false;Menu.refreshOnline();
  }
  function check(){
    if(Game.active()) return;
    const m=lobby.find(l=>l.host===myId&&l.st==="taken"&&l.guest&&l.id===waiting);
    if(m){waiting=null;start(m,0);}
  }
  function sanitize(m){
    if(!m||typeof m!=="object") return null;
    const T=["bench","sup","attach","atk","retreat","joker","end","choice","resign"],int=v=>Number.isInteger(v)?v:-99;
    if(!T.includes(m.t)||!Number.isInteger(m.n)||m.n<0||(m.p!==0&&m.p!==1)) return null;
    const o={n:m.n,p:m.p,t:m.t};
    if(m.h!=null)o.h=int(m.h);if(m.k!=null)o.k=int(m.k);if(m.b!=null)o.b=int(m.b);if(m.i!=null)o.i=int(m.i);if(m.z!=null)o.z=m.z==="a"?"a":int(m.z);
    return o;
  }
  async function start(l,me,resume){
    if(!user) return;
    try{const ps=await user.profiles([l.host,l.guest]);[l.host,l.guest].forEach(id=>names[id]=(ps[id]&&ps[id].name)||names[id]||"Mitspieler");}catch(e){}
    const P=Profile.get();P.cur={mid:l.id,me};Profile.save();
    const cfg={decks:[l.hd,l.gd],zweig:[l.hz,l.gz],seed:l.seed,names:[nameOf(l.host),nameOf(l.guest)],me};
    const mine=db.doc(`matches/${l.id}/p/${me}`),theirs=db.doc(`matches/${l.id}/p/${1-me}`);
    let myMoves=[],writing=false,dirty=false,r=null,unsub=[];
    const flush=async()=>{if(writing){dirty=true;return;}writing=true;try{await mine.set({moves:myMoves.slice(),by:myId,t:Date.now()});}catch(e){}writing=false;if(dirty){dirty=false;flush();}};
    const net={send:m=>{myMoves.push(m);flush();if(r)r.emit("mv",m).catch(()=>{});},close:res=>{unsub.forEach(f=>{try{f();}catch(e){}});if(r)r.leave().catch(()=>{});P.cur=null;Profile.save();if(me===0)db.collection("lobby").doc(l.id).update({st:"done"}).catch(()=>{});}};
    if(resume){try{const s=await mine.get();if(s.exists)myMoves=(s.data().moves||[]).map(sanitize).filter(Boolean);}catch(e){}}
    const M=Game.startOnline(cfg,net);
    myMoves.forEach(m=>M.push(m));
    unsub.push(theirs.onSnapshot(s=>{if(s.exists)(s.data().moves||[]).forEach(m=>{const x=sanitize(m);if(x&&x.p===1-me)M.push(x);});},()=>{}));
    if(room){try{r=await room.join("m-"+l.id);unsub.push(r.on("mv",msg=>{if(!msg.isMe){const x=sanitize(msg.data);if(x&&x.p===1-me)M.push(x);}},()=>{}));r.presence({p:me});
      unsub.push(r.onPeers(c=>{Game.setOppAway(!c.peers.some(p=>!p.isMe&&p.presence&&p.presence.p===1-me));},()=>{}));}catch(e){r=null;}}
  }
  async function resume(){
    const P=Profile.get();if(!P.cur||!ready){P.cur=null;Profile.save();Menu.render();return;}
    const s=await db.collection("lobby").doc(P.cur.mid).get().catch(()=>null);
    if(!s||!s.exists||s.data().st==="done"){P.cur=null;Profile.save();Menu.render();return;}
    start(Object.assign({id:s.id},s.data()),P.cur.me,true);
  }
  return {init,panelHTML,handle,status,resume,peers:()=>peers||1,myName:()=>myNameStr,setMyName:n=>{myNameStr=n||myNameStr;},ready:()=>ready};
})();

/* ---------- Start ---------- */
Game.onEnd=res=>{const P=Profile.get();if(res.mode==="ai"){res.won?P.stats.w++:P.stats.l++;}else{res.won?P.stats.ow++:P.stats.ol++;}if(res.won)P.packs.bonus=Math.min(20,P.packs.bonus+1);Profile.save();};
Game.onExit=()=>Menu.open();
$("menu").addEventListener("click",e=>Menu.onClick(e));
$("menu").addEventListener("submit",e=>Menu.onSubmit(e));
$("menu").addEventListener("input",e=>{if(e.target.id==="dname")e.target.dataset.dirty="1";});
(async()=>{
  Game.layout();
  if(!window.LZ_SITE){await Profile.init(null,null);Menu.open("start");}
  else document.querySelector("#menu .view").innerHTML='<section class="panel"><p class="lead">Lade …</p></section>';
  const {db,uid}=await Online.init();
  await Profile.init(db&&uid?db:null,uid||null);
  Menu.open("start");
})();

</script>
