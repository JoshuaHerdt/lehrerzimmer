<!doctype html>
<html lang="de">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="description" content="Lehrerzimmer – das Sammelkartenspiel der FOS Holzkirchen.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lehrerzimmer Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: Die Blender-Szene ist die Bühne. Eine Stage im Seitenverhältnis des Renders (quer oder hoch) wird eingepasst;
   Feldkarten liegen per matrix3d perspektivisch in den gerenderten Mulden, Bedienelemente schweben als HUD darüber.
   Eine feste Optik (heller Klassenraum), deshalb ein Farbsatz für beide Themes. */
:root{
  --ink:#16202a; --ink-2:#4b5a68; --paper:#fbf8f1; --card:#fffdf8; --line:#d9d2c2;
  --pen:#c62f28; --pen-ink:#ffffff; --chalk:#f4f1e6; --gold:#d9a441; --ok:#2e8b57; --night:#1b2a33;
  --mint:#1f78b4; --spo:#2e8b57; --kun:#8a4fbf; --ges:#c68511; --spr:#c2412d; --sl:#3b4453; --off:#7a8494; --sup:#7a4a2a;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-chalk:"Kalam","Comic Sans MS","Bradley Hand",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#app::before{content:"";position:absolute;inset:-40px;background:var(--bgimg) center/cover no-repeat;filter:blur(24px) saturate(1.1) brightness(.8);transform:scale(1.05)}
#stage{position:relative;flex:none;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);--u:1px}
#stage>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}

/* Kartenflächen */
.card{position:absolute;left:0;top:0;width:160px;height:223px;transform-origin:0 0;border-radius:11px;background:var(--c);padding:6px;box-sizing:border-box;
  box-shadow:0 2px 0 rgba(0,0,0,.18);font-family:var(--f-body);color:var(--ink);cursor:pointer}
.card .in{height:100%;border-radius:7px;background:var(--card);display:grid;grid-template-rows:auto 1fr auto auto;gap:4px;padding:7px 8px 6px;box-sizing:border-box}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.card .nm{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.02;letter-spacing:-.01em}
.card .hp{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--c);white-space:nowrap}
.card .hp small{font-size:9px;font-weight:700;color:var(--ink-2);margin-left:1px}
.card .art{border-radius:6px;background:repeating-linear-gradient(0deg,transparent 0 9px,color-mix(in srgb,var(--c) 14%,transparent) 9px 10px),repeating-linear-gradient(90deg,transparent 0 9px,color-mix(in srgb,var(--c) 14%,transparent) 9px 10px),color-mix(in srgb,var(--c) 10%,#fff);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--c);letter-spacing:-.03em}
.card .bar{height:7px;border-radius:4px;background:#e7e1d2;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .5s ease}
.card .bar.low i{background:var(--pen)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.cups{display:flex;gap:2px}
.cup{width:14px;height:14px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.cup svg{width:9px;height:9px;fill:#5a3b00}
.card.sup{--c:#7a4a2a}
.card.sup .art{font-size:30px}
.card .txt{font-size:10px;line-height:1.25;color:var(--ink-2)}
.card.back{background:#1d2a44;padding:7px}
.card.back .in{background:#1d2a44;border:3px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:#fff;text-align:center;line-height:1}
.card.back .in em{font-style:normal;color:var(--gold)}
.card.hit{animation:hit .45s ease}
@keyframes hit{0%,100%{filter:none}30%{filter:brightness(1.6) saturate(.6)}}
.card.ko{transition:opacity .5s ease;opacity:0}
.card.target{outline:4px solid var(--gold);outline-offset:2px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#fff6d8}}
.card:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* Feldkarte: kräftig und auf kleine Größe lesbar */
.card.f{padding:0;background:var(--c);border:5px solid #fffdf8;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.card.f .in{background:none;padding:0;grid-template-rows:1fr auto;gap:0;border-radius:6px;overflow:hidden}
.card.f .art{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,#fff 22%,var(--c)),var(--c) 70%);color:#fff;font-size:64px;border-radius:0;position:relative;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.card.f .hpb{position:absolute;right:6px;top:6px;background:#fffdf8;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;border-radius:999px;padding:5px 9px}
.card.f .hpb.low{background:var(--pen);color:#fff}
.card.f .en{position:absolute;left:6px;bottom:6px;display:flex;gap:3px}
.card.f .en .cup{width:24px;height:24px}.card.f .en .cup svg{width:15px;height:15px}
.card.f .foot{background:#fffdf8;padding:6px 8px 7px;display:grid;gap:5px}
.card.f .nm{font-size:19px;line-height:1.02}
.card.f .bar{height:9px}
#peek{position:absolute;z-index:44;pointer-events:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));transition:opacity .15s ease}
#peek.off{opacity:0}
/* leere Zonen als Ziel */
.slot{position:absolute;left:0;top:0;width:160px;height:223px;transform-origin:0 0;border-radius:12px;border:5px dashed transparent;box-sizing:border-box;pointer-events:none}
.slot.drop{border-color:#ffe08a;background:rgba(255,224,138,.18);animation:pulse 1s ease-in-out infinite}
.lbl{position:absolute;transform:translate(-50%,0);font-size:calc(var(--u)*11);font-weight:700;color:#e9f3f1;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none}

/* Kreide-Punkte auf der Tafel */
.chalk{position:absolute;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*28);font-family:var(--f-chalk);color:var(--chalk);text-shadow:0 0 1px rgba(255,255,255,.4);pointer-events:none}
.chalk .side{display:flex;flex-direction:column;align-items:center;line-height:1}
.chalk .who{font-size:calc(var(--u)*20)}
.chalk .pts{font-size:calc(var(--u)*56);font-weight:700}
.chalk .pts small{font-size:.45em;opacity:.75}
.chalk .vs{font-size:calc(var(--u)*30);opacity:.8}
.chalk .tally{display:flex;gap:calc(var(--u)*6);margin-top:calc(var(--u)*4)}
.chalk .tally i{width:calc(var(--u)*16);height:calc(var(--u)*16);border:2px solid var(--chalk);border-radius:50%;opacity:.55}
.chalk .tally i.on{background:var(--chalk);opacity:1}

/* HUD */
.plate{position:absolute;display:flex;align-items:center;gap:calc(var(--u)*10);background:rgba(251,248,241,.94);border-radius:calc(var(--u)*14);padding:calc(var(--u)*8) calc(var(--u)*14);box-shadow:0 8px 24px -10px rgba(0,0,0,.5);font-size:calc(var(--u)*13)}
.plate .dot{width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;background:var(--c)}
.plate b{font-family:var(--f-display);font-weight:800;font-size:calc(var(--u)*16)}
.plate .zw{font-weight:700;color:var(--c)}
.plate .mini{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:calc(var(--u)*12);padding:calc(var(--u)*9) calc(var(--u)*14);cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.joker{background:color-mix(in srgb,var(--c) 16%,var(--card));border:2px solid var(--c)}
#endturn{position:absolute;width:calc(var(--u)*118);height:calc(var(--u)*118);border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ef5b52,var(--pen) 60%,#8f1d18);color:#fff;font-family:var(--f-display);font-weight:800;font-size:calc(var(--u)*16);line-height:1.05;
  box-shadow:0 calc(var(--u)*7) 0 #6d1511,0 calc(var(--u)*16) calc(var(--u)*24) -6px rgba(0,0,0,.5);text-align:center;padding:0}
#endturn:active{transform:translateY(calc(var(--u)*5));box-shadow:0 calc(var(--u)*2) 0 #6d1511}
#endturn:disabled{filter:grayscale(.7) brightness(.85);cursor:wait}
#endturn small{display:block;font-family:var(--f-body);font-weight:700;font-size:calc(var(--u)*10);opacity:.85;margin-top:3px}
#turnflag{position:absolute;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:calc(var(--u)*17);background:var(--ink);color:var(--paper);padding:calc(var(--u)*7) calc(var(--u)*14);border-radius:999px;box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
#turnflag.you{background:var(--pen)}
#logo{position:absolute;font-family:var(--f-display);font-weight:800;font-size:calc(var(--u)*24);letter-spacing:-.03em;color:var(--ink);line-height:.9;background:rgba(251,248,241,.9);padding:calc(var(--u)*8) calc(var(--u)*12);border-radius:calc(var(--u)*12)}
#logo em{font-style:normal;color:var(--pen)}
#logo small{display:block;font-family:var(--f-chalk);font-weight:400;font-size:calc(var(--u)*13);color:var(--pen);letter-spacing:0;margin-top:2px}
#energy{position:absolute;display:grid;place-items:center;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 40% 35%,#ffe08a,var(--gold) 55%,#9c6b12);
  box-shadow:0 calc(var(--u)*5) 0 #7a520c,0 10px 18px -6px rgba(0,0,0,.5)}
#energy svg{width:46%;height:46%;fill:#4a3000}
#energy:disabled{filter:grayscale(.8);cursor:default}
#energy.armed{animation:pulse 1s ease-in-out infinite;outline:4px solid #fff;outline-offset:3px}
#energy .badge{position:absolute;right:-6%;top:-6%;background:var(--ink);color:#fff;font-weight:700;font-size:calc(var(--u)*11);border-radius:999px;padding:2px 7px}

/* Hand */
#hand{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#hand .hc{position:relative;flex:none;pointer-events:auto;transition:transform .2s ease,margin .2s ease;transform-origin:50% 120%}
#hand .hc .card{position:relative;transform:none}
#hand .hc:hover,#hand .hc:focus-within{z-index:5}
#hand .hc.lift{z-index:6}
.ghost{position:absolute;z-index:50;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s ease;pointer-events:none}

/* Aktionsfenster und Meldungen */
#sheet{position:absolute;z-index:40;background:var(--paper);border-radius:calc(var(--u)*16);box-shadow:0 20px 50px -15px rgba(0,0,0,.6);padding:calc(var(--u)*14);width:min(calc(var(--u)*360),92%);box-sizing:border-box;font-size:calc(var(--u)*13)}
#sheet h3{margin:0 0 calc(var(--u)*8);font-family:var(--f-display);font-size:calc(var(--u)*19);text-wrap:balance}
#sheet .atk{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*10);align-items:center;width:100%;text-align:left;margin-top:calc(var(--u)*6);background:var(--card);border:2px solid var(--line);border-radius:calc(var(--u)*12);padding:calc(var(--u)*9) calc(var(--u)*11);font:inherit;cursor:pointer}
#sheet .atk:hover:not(:disabled){border-color:var(--pen)}
#sheet .atk:disabled{opacity:.5;cursor:not-allowed}
#sheet .atk b{font-size:calc(var(--u)*15)}
#sheet .atk small{display:block;color:var(--ink-2);font-size:calc(var(--u)*11.5)}
#sheet .atk .d{font-family:var(--f-display);font-weight:800;font-size:calc(var(--u)*24)}
#sheet .row{display:flex;gap:calc(var(--u)*8);justify-content:flex-end;margin-top:calc(var(--u)*10)}
#toast{position:absolute;z-index:45;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:calc(var(--u)*9) calc(var(--u)*18);font-weight:700;font-size:calc(var(--u)*14);box-shadow:0 10px 26px -10px rgba(0,0,0,.6);transition:opacity .3s ease;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.off{opacity:0}
.dmg{position:absolute;z-index:46;font-family:var(--f-display);font-weight:800;color:#fff;-webkit-text-stroke:2px var(--pen);paint-order:stroke;text-shadow:0 4px 0 var(--pen);pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-20%) scale(1.15);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
#over{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:rgba(22,32,42,.55)}
#over .box{background:var(--paper);border-radius:18px;padding:22px 26px;text-align:center;max-width:86%}
#over h2{margin:0 0 6px;font-family:var(--f-display);font-size:30px}
#over p{margin:0 0 14px;font-family:var(--f-chalk);font-size:20px;color:var(--pen)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* Phase 2: Engine-Anbindung */
[hidden]{display:none!important}
#stage:not(.pt) #plate0{max-width:calc(var(--u)*275);flex-wrap:wrap;row-gap:calc(var(--u)*6)}
#stage.pt #plate0{max-width:calc(100% - var(--u)*130);flex-wrap:wrap;row-gap:calc(var(--u)*6)}
#stage.pt #plate0 .mini{display:none}
#stage.pt .plate .btn{padding:calc(var(--u)*7) calc(var(--u)*10);font-size:calc(var(--u)*12.5)}
.card.f.sel{outline:5px solid #fff;outline-offset:3px}
.card.f.enter .in{animation:enter .5s ease}
@keyframes enter{0%{opacity:0;filter:brightness(2)}100%{opacity:1;filter:none}}
.card.f.gone{animation:gone .7s ease forwards;pointer-events:none}
@keyframes gone{0%{opacity:1;filter:none}100%{opacity:0;filter:grayscale(1) brightness(1.4)}}
.card.f.dead{filter:grayscale(.85) brightness(.95)}
.card.f .badge{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;font-family:var(--f-body);font-weight:700;font-size:15px;border-radius:999px;padding:3px 8px;text-shadow:none}
.card.f .lock{position:absolute;right:6px;bottom:6px;background:var(--pen);color:#fff;font-family:var(--f-body);font-weight:700;font-size:13px;border-radius:999px;padding:3px 8px;text-shadow:none}
.heal{-webkit-text-stroke:2px var(--ok);text-shadow:0 4px 0 var(--ok)}
/* volle Karte (Vorschau, Auswahl) */
.card.full{width:200px;height:280px;cursor:default}
.card.full{overflow:hidden}
.card.full .in{grid-template-rows:auto auto 54px auto 1fr auto;gap:3px;overflow:hidden}
.card.full .nm{font-size:17px}
.card.full .fach{font-size:10px;color:var(--ink-2);line-height:1.2}
.card.full .art{font-size:34px}
.card.full .pass{font-size:8.6px;line-height:1.2;border:1px dashed color-mix(in srgb,var(--c) 60%,transparent);border-radius:5px;padding:3px 5px}
.card.full .pass b{display:block;color:var(--c);font-size:10px}
.card.full .atks{display:grid;gap:3px;align-content:start}
.card.full .ar{display:grid;grid-template-columns:auto 1fr auto;gap:5px;align-items:center;border-top:1px solid var(--line);padding-top:3px}
.card.full .ar b{font-size:11.5px;line-height:1.1}
.card.full .ar span.t{display:block;font-size:8.2px;line-height:1.15;color:var(--ink-2)}
.card.full .ar .d{font-family:var(--f-display);font-weight:800;font-size:17px}
.card.full .ar .cup{width:12px;height:12px}.card.full .ar .cup svg{width:8px;height:8px}
.card.full .ft{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-2);gap:4px}
.card.full.sup .in{grid-template-rows:auto auto 1fr auto}
.card.full.sup .art{font-size:48px}
.card.full .txt{font-size:12px}
/* Auswahlfenster der Engine */
.mwrap{position:absolute;inset:0;z-index:55;background:rgba(22,32,42,.55);display:grid;place-items:center;padding:calc(var(--u)*12);box-sizing:border-box}
.mbox{background:var(--paper);border-radius:calc(var(--u)*18);padding:calc(var(--u)*16);max-width:100%;max-height:100%;overflow:auto;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.mbox h3{margin:0 0 calc(var(--u)*12);font-family:var(--f-display);font-size:calc(var(--u)*20);text-wrap:balance;max-width:40ch}
.mopts{display:flex;flex-wrap:wrap;gap:calc(var(--u)*10);justify-content:center}
.mopt{border:0;padding:0;background:none;cursor:pointer;border-radius:12px;position:relative}
.mopt:hover .card,.mopt:focus-visible .card{outline:4px solid var(--gold);outline-offset:2px}
.mview .mopt{cursor:default}.mview .mopt:hover .card{outline:none}
.mview .mrow{gap:10px;flex-wrap:wrap;justify-content:center}.mview .mrow .btn{min-width:180px;min-height:48px;font-size:16px}
.mopt .st{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,50%);background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.mrow{display:flex;gap:calc(var(--u)*8);justify-content:center;margin-top:calc(var(--u)*16);flex-wrap:wrap}
.btn.pri{background:var(--pen);color:#fff}
/* Aktionsblase über der Hand */
#bubble{position:absolute;z-index:42;background:var(--paper);border-radius:calc(var(--u)*14);box-shadow:0 14px 30px -12px rgba(0,0,0,.55);padding:calc(var(--u)*10) calc(var(--u)*12);width:min(calc(var(--u)*300),94%);box-sizing:border-box;font-size:calc(var(--u)*12.5)}
#bubble b.t{font-family:var(--f-display);font-size:calc(var(--u)*16)}
#bubble p{margin:calc(var(--u)*4) 0 calc(var(--u)*8);color:var(--ink-2);line-height:1.35}
#bubble .row{display:flex;gap:calc(var(--u)*8);flex-wrap:wrap}
#bubble .why{color:var(--pen);font-weight:700;margin:calc(var(--u)*6) 0 0}
/* Lobby */
#lobby{position:absolute;inset:0;z-index:58;display:grid;place-items:center;background:rgba(22,32,42,.35);padding:calc(var(--u)*14);box-sizing:border-box}
#lobby .box{background:var(--paper);border-radius:calc(var(--u)*20);padding:calc(var(--u)*20);width:min(calc(var(--u)*720),100%);max-height:100%;overflow:auto;box-sizing:border-box;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
#lobby h2{margin:0;font-family:var(--f-display);font-size:calc(var(--u)*30);letter-spacing:-.02em}
#lobby h2 em{font-style:normal;color:var(--pen)}
#lobby .lead{margin:calc(var(--u)*4) 0 calc(var(--u)*14);color:var(--ink-2);font-size:calc(var(--u)*13.5);max-width:62ch}
.zg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u)*10)}
.zb{text-align:left;border:2px solid var(--line);border-top:calc(var(--u)*6) solid var(--c);border-radius:calc(var(--u)*14);background:var(--card);padding:calc(var(--u)*10) calc(var(--u)*12);cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:calc(var(--u)*4);min-width:0}
.zb[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.zb b.n{font-family:var(--f-display);font-size:calc(var(--u)*17)}
.zb span{font-size:calc(var(--u)*12);line-height:1.35;color:var(--ink-2)}
.zb span b{color:var(--ink)}
.dm{display:flex;gap:calc(var(--u)*8);margin:calc(var(--u)*14) 0 0;flex-wrap:wrap;align-items:center;font-size:calc(var(--u)*13)}
.chipb{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:calc(var(--u)*6) calc(var(--u)*12);font:inherit;font-weight:700;cursor:pointer}

.me{position:relative}

#menu .btn.pri{background:linear-gradient(180deg,#d8443c,var(--pen));box-shadow:0 4px 0 #8f1d18}
#menu .btn.pri:active{box-shadow:0 1px 0 #8f1d18}
#menu .linkb{color:var(--pen);font-size:14px;padding:0}
#menu h2{font-family:var(--f-display);font-size:22px;margin:0 0 6px;letter-spacing:-.02em;line-height:1.1}
#menu h3{font-family:var(--f-display);font-size:17px;margin:20px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#menu .mini{font-size:13px;color:var(--ink-2);margin:0}
#menu .phead{margin-bottom:12px;align-items:flex-start}
.pill.live{background:var(--ok)}.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#bff5cf;margin-right:5px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#efe9dc;border-radius:999px;padding:5px 11px;font-size:13px}

details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}

/* Fächer aus Karten */
.fan{position:relative;display:block;width:calc(var(--w)*2.1);height:calc(var(--h)*1.08);flex:none}
.fan .fc{position:absolute;left:50%;top:4%;width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);transform:translateX(calc(var(--i)*var(--w)*.52)) rotate(calc(var(--i)*9deg)) translateY(calc(var(--i)*var(--i)*6px));transform-origin:50% 120%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));transition:transform .25s}
.fan .fc .mc{border-radius:10px;overflow:hidden}
button:hover>.fan .fc,.deckshow:hover .fan .fc{transform:translateX(calc(var(--i)*var(--w)*.6)) rotate(calc(var(--i)*12deg)) translateY(calc(var(--i)*var(--i)*8px - 4px))}

/* Start */
.hero3{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:center;background:linear-gradient(135deg,var(--paper) 55%,color-mix(in srgb,var(--c) 18%,var(--paper)))!important}
.hero3 h1{font-family:var(--f-display);font-size:clamp(30px,6vw,48px);line-height:1;margin:6px 0 10px;letter-spacing:-.03em}
.hero3 .lead{font-size:16px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.deckshow .dl{display:grid;justify-items:center;text-align:center;gap:2px}
.deckshow .dl b{font-family:var(--f-display);font-size:18px}.deckshow .dl>span{font-size:13px;color:var(--ink-2)}
.deckshow em{font-style:normal;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qc{display:flex;align-items:center;gap:14px;border:0;font:inherit;color:var(--ink);text-align:left;min-width:0;padding:16px!important}
button.qc{cursor:pointer;transition:transform .15s}button.qc:hover{transform:translateY(-2px)}
.qc .qt{display:grid;gap:2px;min-width:0}.qc .qt b{font-family:var(--f-display);font-size:17px;line-height:1.15}.qc .qt span{font-size:13px;color:var(--ink-2)}
.qc.ready{background:linear-gradient(135deg,#fff7e2,var(--paper))!important;box-shadow:0 0 0 2px var(--gold),0 22px 44px -26px rgba(0,0,0,.8)!important}
.qc.ready .qt span{color:#9a6a12;font-weight:700}
.qc.stats{justify-content:space-around;text-align:center;gap:6px}
.qc.stats div{display:grid;gap:2px}.qc.stats b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}.qc.stats span{font-size:11.5px;color:var(--ink-2);line-height:1.2}
.ring{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}.ring circle{fill:none;stroke:#e7e1d2;stroke-width:5}.ring circle.v{stroke:var(--pen);stroke-linecap:round}
.ring b{font-family:var(--f-display);font-size:14px}
.banner.slim{display:flex;align-items:center;gap:12px;background:rgba(217,164,65,.16);border:1px solid rgba(217,164,65,.5);color:var(--chalk);border-radius:16px;padding:10px 12px 10px 14px}
.banner.slim span{flex:1;font-size:14px;line-height:1.35}.banner.slim .ico{color:var(--gold)}
.banner .aform.inline{margin:0;border:0;padding:0;background:none}
.steps{list-style:none;margin:8px 0 10px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;background:#f3eee2;border-radius:14px;padding:12px}
.steps i{grid-row:span 2;font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--pen);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.steps b{font-family:var(--f-display)}.steps span{font-size:13.5px;color:var(--ink-2);line-height:1.4}

/* Packs */
.packart{position:relative;display:grid;place-items:center;align-content:center;gap:4px;width:var(--pw,56px);height:calc(var(--pw,56px)*1.38);border-radius:calc(var(--pw,56px)*.1);overflow:hidden;flex:none;
  background:linear-gradient(160deg,#283d6b 0%,#1a2747 55%,#2a1f45 100%);box-shadow:inset 0 0 0 calc(var(--pw,56px)*.03) #f2c14e,0 10px 22px -10px rgba(0,0,0,.6);color:#fff;text-align:center}
.packart::before{content:"";position:absolute;left:0;right:0;top:9%;height:5%;background:repeating-linear-gradient(90deg,#f2c14e 0 6%,transparent 6% 9%);opacity:.7}
.packart::after{content:"";position:absolute;left:0;right:0;bottom:9%;height:5%;background:repeating-linear-gradient(90deg,#f2c14e 0 6%,transparent 6% 9%);opacity:.7}
.pa-foil{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 48%,transparent 56%);transform:translateX(-60%)}
@media (prefers-reduced-motion:no-preference){.packart .pa-foil{animation:foil 3.2s ease-in-out infinite}}
@keyframes foil{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.pa-logo{position:relative;font-family:var(--f-display);font-weight:800;font-size:calc(var(--pw,56px)*.16);line-height:1;letter-spacing:-.02em}.pa-logo em{font-style:normal;color:#f2c14e;display:block}
.pa-sub{position:relative;font-family:var(--f-chalk);font-size:calc(var(--pw,56px)*.085);color:#f2c14e}
.packart.sm{--pw:52px}.packart.sm .pa-sub{display:none}
.packart.lg{--pw:min(46vw,190px)}
.packart.empty{filter:grayscale(.85) brightness(.85)}
.packhero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.packbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:20px;transition:transform .2s}
.packbtn:not(:disabled):hover{transform:translateY(-4px) rotate(-1.5deg)}
.packbtn:disabled{cursor:default}
@media (prefers-reduced-motion:no-preference){.packbtn:not(:disabled) .packart{animation:bob 3s ease-in-out infinite}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pcount{position:absolute;right:-10px;top:-10px;min-width:38px;height:38px;border-radius:19px;background:var(--pen);color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--paper)}
.pinfo{flex:1;min-width:230px;display:grid;gap:10px;justify-items:start}.pinfo h2,.pinfo .lead{margin:0}
.best{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}.best .chips{margin-top:8px}
.reveal .stage5{display:grid;grid-template-columns:repeat(auto-fill,var(--w));justify-content:center;gap:12px;margin:8px 0 16px}
.reveal .flip{width:var(--w);height:var(--h)}
.reveal .flip .backside{width:100%;height:100%;border-radius:12px;background:linear-gradient(160deg,#283d6b,#1a2747);display:grid;place-items:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.reveal .flip .backside span{border:3px solid #f2c14e;border-radius:10px;width:80%;height:86%;display:grid;place-content:center;text-align:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:calc(var(--w)*.12)}
.reveal .flip .backside em{font-style:normal;color:#f2c14e;display:block}
@media (prefers-reduced-motion:no-preference){.reveal button.flip .backside{animation:wiggle 2.4s ease-in-out infinite}.reveal button.flip:nth-child(2) .backside{animation-delay:.2s}.reveal button.flip:nth-child(3) .backside{animation-delay:.4s}.reveal button.flip:nth-child(4) .backside{animation-delay:.6s}.reveal button.flip:nth-child(5) .backside{animation-delay:.8s}}
@keyframes wiggle{0%,85%,100%{transform:none}90%{transform:rotate(-2deg) scale(1.02)}95%{transform:rotate(2deg) scale(1.02)}}
.row.center{justify-content:center}

/* Decks */
.dscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.dscroll .dtile{flex:0 0 172px;scroll-snap-align:start}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.dtile{display:grid;gap:8px;align-content:start;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:10px;position:relative;overflow:hidden}
.dtile::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.dtile.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.dcov{position:relative;border:0;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#f4efe3);display:grid;place-items:center;padding:12px 0 6px;cursor:pointer;min-height:120px}
.dcov .act{position:absolute;left:8px;top:8px;background:var(--c);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.dinf{display:grid;gap:2px;padding:0 4px}.dinf b{font-family:var(--f-display);font-size:16px}.dinf span{font-size:12.5px;color:var(--ink-2)}
.dinf .warn,.dinf .ok{font-size:12.5px}
.dact{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 4px}
.editor .edbar{position:sticky;top:-8px;z-index:4;margin:-20px -20px 0;padding:14px 20px 12px;background:color-mix(in srgb,var(--c) 10%,var(--paper));border-bottom:1px solid var(--line);border-radius:20px 20px 0 0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.edtop{display:flex;gap:8px;align-items:center}
.edtop input{flex:1;min-width:0;width:0;font:inherit;font-family:var(--f-display);font-weight:800;font-size:18px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{display:grid;justify-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
.meter b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}.meter span{font-size:11.5px;color:var(--ink-2)}
.meter.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}.meter.ok b{color:var(--ok)}
.editor .status{margin:0;padding:6px 10px;font-size:13.5px}
.zpick3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.zb3{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:10px 12px 10px 14px;font:inherit;text-align:left;cursor:pointer;display:grid;gap:4px;min-width:0;position:relative;overflow:hidden;color:var(--ink)}
.zb3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.zb3 b{font-family:var(--f-display);font-size:15.5px;line-height:1.1}
.zb3 span{font-size:12.5px;color:var(--ink-2);line-height:1.35}.zb3 i{font-style:normal;font-weight:700;color:var(--ink)}
.zb3[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.zb3[aria-pressed="true"] b::after{content:" ✓";color:var(--c)}
.zpick3.small .zb3 span{font-size:12px}
.cg.fit{gap:10px;justify-content:flex-start}
.cg.fit .mc{border-radius:10px}
.pk.on .mc{outline-offset:1px}
.pk .badge2{top:6px;right:auto;left:50%;transform:translateX(-50%);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* Album */
.ahead{display:flex;align-items:center;gap:14px;margin-bottom:12px}.ahead>div{flex:1;min-width:0;display:grid;gap:4px}.ahead h2{margin:0}
.ahead .ring{width:64px;height:64px}
.ac{border:0;padding:0;background:none;cursor:pointer;border-radius:10px;transition:transform .15s}button.ac:hover{transform:translateY(-3px)}
.ac .cnt{top:6px;right:6px}
.mzoom{position:fixed;inset:0;z-index:90;background:rgba(6,14,18,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-content:center;justify-items:center;gap:16px;padding:20px;cursor:zoom-out}
.mzoom .mc{border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
@media (prefers-reduced-motion:no-preference){.mzoom .mc{animation:pop .3s ease-out}}

/* Spielen */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mode{display:grid;gap:8px;align-content:start}
.mode .lead{margin:0 0 4px}
.mico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#f0e9d9;color:var(--pen)}.mico .ico{width:28px;height:28px}
#onlinepanel .mico{color:var(--ok)}
#onlinepanel h3{margin-top:12px}
.wait{display:flex;gap:10px;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid #e2dccd;border-top-color:var(--ok);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Regeln */
.steps.big{grid-template-columns:repeat(3,minmax(0,1fr))}
.cyc .ar{color:var(--ink-2);font-weight:400}
.cyc .s{background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:999px;padding:4px 10px}
.zrules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zr{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px}
.zr b{font-family:var(--f-display);font-size:16px}.zr p{margin:6px 0 0;font-size:14px;line-height:1.45;color:var(--ink-2)}.zr i{font-style:normal;font-weight:700;color:var(--ink)}

/* Willkommen */
.welcome3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center;max-width:1040px;margin:0 auto;width:100%;min-height:calc(100% - 20px)}
.wcopy{display:grid;justify-items:center;text-align:center;gap:8px;color:var(--chalk)}
.wcopy .wt{font-family:var(--f-display);font-size:clamp(34px,6vw,58px);line-height:.95;margin:0;letter-spacing:-.03em}.wcopy .wt em{font-style:normal;color:#ff7b6e}
.wcopy .tag{font-family:var(--f-chalk);font-size:20px;color:var(--gold);margin:0 0 10px}
.wform{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.wform h2{margin-top:6px!important}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#ece5d6;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:10px 6px;border-radius:10px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.welcome3 .zpick3{grid-template-columns:repeat(2,minmax(0,1fr))}
.aform{max-width:none;grid-template-columns:minmax(0,1fr)}.aform .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.aform input{min-width:0;width:100%;box-sizing:border-box}
#menu.noprof .bar{display:none}
#menu.noprof .view{padding-top:max(20px,env(safe-area-inset-top,0px));align-content:safe center}

@media (min-width:861px){#menu .tabs .nb{position:static;margin-left:-2px;box-shadow:none}.hero3 .deckshow .fan{transform:scale(1.25);margin:22px 0 18px}}
@media (max-width:860px){
  #menu .bar{padding-left:16px;padding-right:16px}
  #menu .brand{font-size:20px}
  #menu .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border:0;border-top:1px solid rgba(244,241,230,.12);border-radius:0;background:rgba(8,18,22,.92);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  #menu .tabs button{flex-direction:column;gap:3px;padding:6px 0 4px;font-size:11px;border-radius:12px;min-height:50px;justify-content:center}
  #menu .tabs button[aria-current="page"]{background:rgba(244,241,230,.12);color:var(--chalk)}
  #menu .tabs button[aria-current="page"] .ico{color:var(--gold)}
  #menu .tabs .ico{width:22px;height:22px}
  #menu .tabs .nb{top:2px;right:calc(50% - 22px)}
  #menu .who{margin-left:auto}
  #menu .view{padding:4px 12px calc(86px + env(safe-area-inset-bottom,0px))}
  #menu .panel,#menu .hero3{padding:16px;border-radius:18px}
  .hero3{grid-template-columns:1fr;gap:6px}
  .hero3 .deckshow{grid-row:1;padding:0}
  .hero3 .hcopy{text-align:center}.hero3 .cta{justify-content:center}
  .hero3 .cta .btn{flex:1 1 100%}
  .hero3 h1{font-size:32px}
  .quick{grid-template-columns:1fr 1fr}.quick .qc.stats{grid-column:1/-1}
  .qc{flex-direction:column;align-items:flex-start;gap:10px}
  .qc.stats{flex-direction:row}
  .steps,.steps.big{grid-template-columns:1fr}

/* ---------- Helfer ---------- */
function shuffle(a,rng=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Zufallsdeck für einen Zweig: 5–7 Lehrkräfte aus dem Zweig, der Rest beliebig (höchstens 1 Schulleitung)
function randomDeck(rng=Math.random,R=RULES,zweig){
  zweig=zweig||ZWEIG_KEYS[Math.floor(rng()*ZWEIG_KEYS.length)];
  const nOwn=Math.min(R.deckTeachers,R.zweigMin+Math.floor(rng()*3));
  const own=shuffle(CARDS.filter(c=>c.subj===zweig).map(c=>c.id),rng).slice(0,nOwn);
  const out=own.slice(); let leg=0;
  for(const id of shuffle(CARDS.filter(c=>c.subj!==zweig).map(c=>c.id),rng)){ if(out.length===R.deckTeachers) break; if(byId(id).legend){ if(leg) continue; leg++; } out.push(id); }
  const pool=shuffle(SUPPORTS.flatMap(x=>Array(R.maxSupportCopies).fill(x.id)),rng);
  for(let k=0;k<R.deckSupports;k++) out.push(pool[k]);
  return out;
}
function mainZweig(ids){const n={};ids.map(byId).filter(Boolean).forEach(c=>{if(ZWEIGE[c.subj])n[c.subj]=(n[c.subj]||0)+1;});return ZWEIG_KEYS.slice().sort((a,b)=>(n[b]||0)-(n[a]||0))[0];}
function deckProblems(ids,zweig,R=RULES){
  const t=ids.filter(byId),s=ids.filter(id=>!byId(id)),out=[];
  if(!ZWEIGE[zweig]) out.push("Wähle zuerst deinen Zweig.");
  if(t.length!==R.deckTeachers) out.push(`Wähle genau ${R.deckTeachers} Lehrkräfte (gerade ${t.length}).`);
  if(s.length!==R.deckSupports) out.push(`Wähle genau ${R.deckSupports} Unterstützungskarten (gerade ${s.length}).`);
  if(new Set(t).size!==t.length) out.push("Jede Lehrkraft nur einmal.");
  if(t.filter(id=>byId(id).legend).length>1) out.push("Höchstens 1 Karte der Schulleitung pro Deck.");
  if(ZWEIGE[zweig]&&t.filter(id=>byId(id).subj===zweig).length<R.zweigMin) out.push(`Mindestens ${R.zweigMin} Lehrkräfte aus deinem Zweig ${ZWEIGE[zweig].name} (gerade ${t.filter(id=>byId(id).subj===zweig).length}).`);
  SUPPORTS.forEach(x=>{if(s.filter(id=>id===x.id).length>R.maxSupportCopies) out.push(`„${x.name}“ höchstens ${R.maxSupportCopies}×.`);});
  return out;
}
const isTeacher=i=>!!(i&&i.card);
const teachersIn=list=>list.filter(isTeacher);
let uidc=0;
const mk=card=>({uid:++uidc,card,dmg:0,energy:0});
const mkS=sup=>({uid:++uidc,sup});
const hpLeft=i=>i.card.hp-i.dmg;
const strongCost=i=>Math.max(...i.card.atks.map(a=>a.cost));
const strongIdx=i=>{let k=0;i.card.atks.forEach((a,j)=>{if(a.cost>i.card.atks[k].cost)k=j;});return k;};
const inPlay=p=>[p.active,...p.bench].filter(Boolean);
function newPlayer(ids,rng,zweig){return {deck:shuffle(ids.map(id=>byId(id)?mk(byId(id)):mkS(supById(id))),rng),hand:[],active:null,bench:[],points:0,discard:[],used:[],ids:ids.slice(),zweig:zweig||mainZweig(ids),jokerUsed:false,perkUses:0};}

function createGame(ids0,ids1,hooks={},opts={}){
  const R=Object.assign({},RULES,opts.rules||{});

  const G={R,rng,hooks,players:[newPlayer(ids0,rng,Z[0]),newPlayer(ids1,rng,Z[1])],cur:0,turn:0,starter:0,attachLeft:0,retreated:false,

    stats:{maxHit:0,oneShots:0,oneShotsEarly:0,kos:0,firstKOTurn:null,attacks:0,strong:0,leadChanges:0,leader:-1,deficit:[0,0],

const who=(G,pi)=>G.names[pi];

function log(G,msg,w){if(G.hooks.trace)G.hooks.trace(msg);G.log.unshift({msg,who:w});if(G.log.length>80)G.log.pop();}
const render=G=>G.hooks.render&&G.hooks.render(G);
const sleep=(G,ms)=>G.hooks.sleep?G.hooks.sleep(ms):Promise.resolve();
function draw(p,n){let k=0;for(let i=0;i<n;i++){if(p.deck.length){p.hand.push(p.deck.pop());k++;}}return k;}
function choose(G,pi,title,options,opt={}){
  if(isHuman(G,pi)&&G.hooks.choose) return G.hooks.choose(G,title,options,opt,pi);
  if(opt.aiSkip||!options.length) return Promise.resolve(null);
  return Promise.resolve(options.slice().sort((a,b)=>b.score-a.score)[0].inst);
}

/* ---------- Kaffee ---------- */
function addKaffee(G,pi,i,n,src){
  if(!i||n<=0) return 0; i.energy+=n;
  if(src==="helper") G.stats.helperKaffee+=n; if(src==="onPlay") G.stats.onPlayKaffee+=n; if(src==="support") G.stats.supportKaffee+=n;
  log(G,`${i.card.name} bekommt ${n} Energie.`,pi); return n;
}
function spendKaffee(G,i,n){const k=Math.min(n,i.energy);i.energy-=k;G.stats.spent+=k;return k;}
function canAttach(G,pi,i){
  if(G.cur!==pi||G.over||G.attachLeft<=0) return false;
  if(i&&G.turn===1&&G.R.firstAttachBenchOnly&&G.players[pi].active===i) return false;
  return true;
}
function attach(G,pi,i){if(!canAttach(G,pi,i)||!i)return false;addKaffee(G,pi,i,1);G.attachLeft--;G.stats.attached++;return true;}
function needScore(i){const d=strongCost(i)-i.energy;return d>0?20-d:-5;}
async function onPlay(G,pi,i){
  const k=i.card.passive?.key, p=G.players[pi], nm=i.card.passive?.name;
  if(k==="onPlaySelf"){log(G,`${i.card.name}: ${nm}!`,pi);addKaffee(G,pi,i,1,"onPlay");}
  if(k==="onPlayAny"){
    const t=await choose(G,pi,`${nm} (${i.card.name}): Welche Lehrkraft bekommt 1 Energie?`,inPlay(p).map(x=>({inst:x,score:needScore(x)+(x===p.active?2:0)})));
    if(t){log(G,`${i.card.name}: ${nm}!`,pi);addKaffee(G,pi,t,1,"onPlay");}
  }
  if(k==="onPlayTwo"){
    log(G,`${i.card.name}: ${nm}!`,pi);
    for(let n=0;n<2;n++){const t=await choose(G,pi,`${nm}: Wer bekommt Energie ${n+1} von 2?`,inPlay(p).map(x=>({inst:x,score:needScore(x)+(x===p.active?2:0)})));if(t)addKaffee(G,pi,t,1,"onPlay");}
  }
  render(G);
}

/* ---------- Unterstützungskarten ---------- */
// Heldenkarten (Gwent): Gegnerische Unterstützungskarten und Joker wirken nicht auf die Schulleitung
const hero=i=>!!(i&&i.card&&i.card.legend);
function scorchTargets(G){
  const c=G.players.map((p,pi)=>({pi,i:p.active})).filter(x=>x.i&&!hero(x.i));
  if(!c.length) return [];
  const top=Math.max(...c.map(x=>hpLeft(x.i)));
  return c.filter(x=>hpLeft(x.i)===top);
}
function canPlaySupport(G,pi,i){
  if(G.cur!==pi||G.over||G.supportsLeft<=0||!i||!i.sup||!G.players[pi].hand.includes(i)) return false;
  if(G.R.supportFromTurn&&G.turn<G.R.supportFromTurn) return false;
  const p=G.players[pi],f=i.sup.fx;
  if(f==="switchAttach") return p.bench.length>0&&!G.noRetreat[pi];
  if(f==="benchEach") return inPlay(p).length>0;
  if(f==="espresso") return !!p.active;
  if(f==="strip1") return !!(G.players[1-pi].active&&G.players[1-pi].active.energy>0&&!hero(G.players[1-pi].active));
  if(f==="draw2") return p.deck.length>0;
  if(f==="scorch") return scorchTargets(G).length>0;
  if(f==="spy") return p.deck.length>0;
  if(f==="decoy") return !!p.active&&p.bench.length>0&&!G.noRetreat[pi];
  if(f==="medic") return p.discard.length>0?p.bench.length<G.R.benchMax:p.deck.length>0;
  return inPlay(p).length>0;
}
async function playSupport(G,pi,i){
  if(!canPlaySupport(G,pi,i)) return false;
  const p=G.players[pi],op=G.players[1-pi],f=i.sup.fx;
  p.hand.splice(p.hand.indexOf(i),1); p.used.push(i); G.supportsLeft--; G.stats.supportsPlayed++;
  log(G,`${who(G,pi)} spielt „${i.sup.name}“.`,pi);
  const pick=async(title,list,score)=>list.length===1?list[0]:await choose(G,pi,title,list.map(x=>({inst:x,score:score(x)})));
  if(f==="attach2"){const t=await pick(`${i.sup.name}: Wer bekommt 2 Energie?`,inPlay(p),x=>needScore(x)+(x===p.active?3:0));addKaffee(G,pi,t,2,"support");}
  if(f==="attachDraw"){const t=await pick(`${i.sup.name}: Wer bekommt 1 Energie?`,inPlay(p),x=>needScore(x)+(x===p.active?3:0));addKaffee(G,pi,t,1,"support");if(draw(p,1))log(G,`${who(G,pi)}: +1 Karte.`,pi);}
  if(f==="healAttach"){const t=await pick(`${i.sup.name}: Wer wird versorgt?`,inPlay(p),x=>Math.min(x.dmg,20)+needScore(x));heal(G,pi,t,20);addKaffee(G,pi,t,1,"support");}
  if(f==="switchAttach"){const t=await pick(`${i.sup.name}: Wer kommt nach vorn?`,p.bench,x=>hpLeft(x)+x.energy*15);log(G,`${p.active.card.name} wird vertreten. ${t.card.name} kommt nach vorn.`,pi);swapActive(p,t);}
  if(f==="espresso"){const a=p.active;addKaffee(G,pi,a,2,"support");const x=Math.min(10,Math.max(0,hpLeft(a)-10));if(x){a.dmg+=x;G.flash.add(a.uid);log(G,`${i.sup.name}: ${a.card.name} erhält ${x} Schaden.`,pi);}}
  if(f==="benchEach"){const all=inPlay(p);
    if(all.length<=2) all.forEach(t=>addKaffee(G,pi,t,1,"support"));
    else{const sc=x=>needScore(x)+(x===p.active?3:0);const t1=await pick(`${i.sup.name}: 1. Lehrkraft`,all,sc);const t2=await pick(`${i.sup.name}: 2. Lehrkraft (eine andere)`,all.filter(x=>x!==t1),sc);addKaffee(G,pi,t1,1,"support");addKaffee(G,pi,t2,1,"support");}}
  if(f==="allEach"){inPlay(p).forEach(t=>addKaffee(G,pi,t,1,"support"));G.attachLeft=0;}
  if(f==="draw2"){const k=draw(p,G.R.konferenzDraw||2);log(G,`${who(G,pi)}: +${k} Karten.`,pi);if(G.R.konferenzKaffee&&p.active)addKaffee(G,pi,p.active,1,"support");}
  if(f==="strip1"){const t=op.active;const n=Math.min(2,t.energy);t.energy-=n;log(G,`${t.card.name} verliert ${n} Energie.`,pi);if(draw(p,1))log(G,`${who(G,pi)}: +1 Karte.`,pi);}
  if(f==="spy"){G.stats.spy++;if(op.active&&!hero(op.active))addKaffee(G,1-pi,op.active,1,"support");const k=draw(p,G.R.spyDraw);log(G,`${who(G,pi)}: +${k} Karten.`,pi);}
  if(f==="decoy"){const a=p.active;const t=await pick(`${i.sup.name}: Wer kommt nach vorn?`,p.bench,x=>hpLeft(x)+x.energy*15);
    p.bench.splice(p.bench.indexOf(t),1);p.active=t;a.dmg=0;a.energy=0;p.deck.unshift(a);G.stats.decoy++;
    log(G,`${a.card.name} meldet sich krank und kommt unter das Deck. ${t.card.name} kommt nach vorn.`,pi);}
  if(f==="medic"&&!p.discard.length){const k=draw(p,2);log(G,`Noch niemand im Feierabend: ${who(G,pi)} zieht ${k} Karten.`,pi);}
  else if(f==="medic"){const t=await pick(`${i.sup.name}: Wer bekommt eine zweite Chance?`,p.discard,x=>x.card.hp+x.card.atks[1].dmg);
    p.discard.splice(p.discard.indexOf(t),1);t.dmg=0;t.energy=0;p.bench.push(t);G.stats.revived++;addKaffee(G,pi,t,G.R.medicEnergy,"support");
    log(G,`${t.card.name} besteht die Nachprüfung und kommt auf die Bank.`,pi);}
  if(f==="scorch"){const ts=scorchTargets(G);G.stats.scorch++;
    ts.forEach(({pi:q,i:t})=>{t.dmg+=G.R.scorchDmg;G.flash.add(t.uid);if(q===pi)G.stats.scorchOwn++;log(G,`Feueralarm! ${t.card.name} erhält ${G.R.scorchDmg} Schaden.`,pi);});
    render(G);const ko=resolveKOs(G);G.stats.scorchKO+=ko.length;if(ko.length&&await promotions(G)) return true;}
  render(G); return true;
}
function aiSupportScore(G,pi,i){
  const p=G.players[pi],op=G.players[1-pi],f=i.sup.fx,a=p.active;
  const need=x=>Math.max(0,strongCost(x)-x.energy);
  const anyNeed=inPlay(p).some(x=>need(x)>0);
  if(f==="attach2") return anyNeed?30:5;
  if(f==="attachDraw") return 18+(anyNeed?8:0);
  if(f==="healAttach") return Math.max(...inPlay(p).map(x=>Math.min(x.dmg,20)))+8;
  if(f==="allEach") return inPlay(p).filter(x=>need(x)>0).length*12-(G.attachLeft>0?12:0);
  if(f==="switchAttach"){if(!p.bench.length||!a)return -1;const b=p.bench.slice().sort((x,y)=>hpLeft(y)-hpLeft(x))[0];return hpLeft(a)<=30&&hpLeft(b)>hpLeft(a)?35:-1;}
  if(f==="espresso") return a&&hpLeft(a)>30&&need(a)>0?26:-1;
  if(f==="benchEach") return Math.min(2,inPlay(p).filter(x=>need(x)>0).length)*13;
  if(f==="draw2") return teachersIn(p.hand).length===0&&p.bench.length<2?28:p.hand.length<=1?16:4;
  if(f==="strip1") return op.active&&op.active.energy>=2?28:op.active&&op.active.energy?12:-1;
  if(f==="scorch") return scorchTargets(G).reduce((v,{pi:q,i:t})=>{const ko=G.R.scorchDmg>=hpLeft(t);return v+(q===pi?-(30+(ko?80:0)):30+(ko?50:0));},0);
  if(f==="spy"){const o=op.active;const gives=o&&!hero(o)&&strongCost(o)-o.energy===1;return (p.hand.length<=2?24:12)-(gives?14:0);}
  if(f==="decoy") return a&&p.bench.length&&hpLeft(a)<=30&&a.dmg>=40?34-a.energy*6:-1;
  if(f==="medic") return p.discard.length?(p.bench.length<2?26:14):(teachersIn(p.hand).length===0&&p.bench.length<2?24:16);
  return 0;
}

/* ---------- Regeln ---------- */
async function benchFromHand(G,pi,i){
  const p=G.players[pi]; if(!isTeacher(i)||p.bench.length>=G.R.benchMax||!p.hand.includes(i)) return false;
  if(G.turn>0&&G.benchLeft<=0) return false;
  p.hand.splice(p.hand.indexOf(i),1); p.bench.push(i);
  if(G.turn>0){G.benchLeft--;G.stats.benchThisTurn++;if(G.stats.benchThisTurn>G.stats.maxBenchTurn)G.stats.maxBenchTurn=G.stats.benchThisTurn;if(G.stats.benchThisTurn===2)G.stats.multiBenchTurns++;}
  log(G,`${who(G,pi)}: ${i.card.name} kommt auf die Bank.`,pi);
  if(G.R.perks&&p.zweig==="MINT"&&i.card.subj==="MINT"&&p.perkUses<G.R.techMax){log(G,`Werkstatt (Technik): ${i.card.name} startet mit 1 Energie.`,pi);addKaffee(G,pi,i,1,"zweig");G.stats.perkEnergy++;p.perkUses++;}
  await onPlay(G,pi,i); return true;
}
function canBench(G,pi,i){const p=G.players[pi];return !!(isTeacher(i)&&p.hand.includes(i)&&p.bench.length<G.R.benchMax&&G.cur===pi&&!G.over&&(G.turn===0||G.benchLeft>0));}
function retreatCost(p,i){let c=i.card.retreat;if(inPlay(p).some(o=>o!==i&&o.card.passive?.key==="coach"))c--;if(p.perkFS)c--;return Math.max(0,c);}
function canRetreat(G,pi){const p=G.players[pi];return !!(G.cur===pi&&!G.over&&p.active&&p.bench.length&&!G.retreated&&!G.noRetreat[pi]&&p.active.energy>=retreatCost(p,p.active));}
function swapActive(p,t){const k=p.bench.indexOf(t);p.bench[k]=p.active;p.active=t;}
function doRetreat(G,pi,t){const p=G.players[pi];const c=retreatCost(p,p.active);spendKaffee(G,p.active,c);
  log(G,`${p.active.card.name} zieht sich zurück${c?` (${c} Energie verbraucht)`:""}. ${t.card.name} kommt nach vorn.`,pi);swapActive(p,t);G.retreated=true;}
function canAttack(G,pi,k){const p=G.players[pi];const a=p.active;if(!a||G.cur!==pi||G.over)return false;if(G.turn===1&&!G.R.firstTurnAttack)return false;return a.energy>=a.card.atks[k].cost;}
function calcDmg(G,src,tgt,n,weak=true){let d=n;if(weak&&d>0&&BEATS[src.card.subj]===tgt.card.subj)d+=G.R.weakBonus;if(tgt.card.passive?.key==="armor10")d=Math.max(0,d-10);return d;}
const inExam=G=>!!G.R.examTurn&&G.turn>=G.R.examTurn;
function baseDamage(G,pi,a,atk,roll){
  const me=G.players[pi],op=G.players[1-pi];const fx=atk.fx||[];const has=t=>fx.find(f=>f.t===t);let f;
  let d=atk.dmg||0;
  if(atk.dice) d=roll==null?30:(roll<=2?10:roll<=4?30:50);
  if(f=has("perOppEnergy")) d+=f.n*(op.active?op.active.energy:0);
  if(f=has("perKO")) d+=f.n*(me.discard.length+op.discard.length);
  if((f=has("hpCompare"))&&op.active&&hpLeft(op.active)>hpLeft(a)) d+=f.n;
  if(f=has("perOwnBench")) d+=f.n*me.bench.length;
  d=Math.min(d,G.R.maxDmg);
  if(inExam(G)&&d>0) d+=G.R.examBonus;
  return d;
}
function heal(G,pi,i,n){const h=Math.min(n,i.dmg);if(h>0){i.dmg-=h;log(G,`${i.card.name} heilt ${h}.`,pi);}}

function dealDamage(G,pi,src,tgt,n,weak,track){
  const d=calcDmg(G,src,tgt,n,weak);
  if(track) track.push({tgt,before:tgt.dmg});
  tgt.dmg+=d; G.flash.add(tgt.uid); if(d>G.stats.maxHit)G.stats.maxHit=d;
  const w=weak&&n>0&&BEATS[src.card.subj]===tgt.card.subj;
  log(G,`${tgt.card.name} erhält ${d} Schaden${w?" (Schwäche +"+G.R.weakBonus+")":""}${tgt.card.passive?.key==="armor10"?" (Schutzbrille −10)":""}.`,pi);
}
function trackLead(G){
  const [a,b]=G.players.map(p=>p.points); const l=a>b?0:b>a?1:-1;
  if(l!==-1&&G.stats.leader!==-1&&l!==G.stats.leader) G.stats.leadChanges++;
  if(l!==-1) G.stats.leader=l;
  G.stats.deficit[0]=Math.max(G.stats.deficit[0],b-a); G.stats.deficit[1]=Math.max(G.stats.deficit[1],a-b);
}
function knockOut(G,pi,i){
  const p=G.players[pi],o=G.players[1-pi];
  o.points+=G.R.koPoints;
  if(i===p.active)p.active=null; else p.bench.splice(p.bench.indexOf(i),1);
  if(i.card.passive?.key==="backup"&&p.bench.length&&i.energy){
    const t=p.bench.slice().sort((a,b)=>needScore(b)-needScore(a))[0];t.energy+=i.energy;log(G,`${i.card.passive.name}: ${i.energy} Energie wandert zu ${t.card.name}.`,pi);
  } else { G.stats.lostOnKO+=i.energy; }
  const tr=inPlay(p).find(x=>x.card.passive?.key==="comfort");
  if(tr){tr.energy+=1;G.stats.helperKaffee++;G.stats.comfort++;log(G,`${tr.card.name} (${tr.card.passive.name}): +1 Energie.`,pi);}
  i.energy=0; p.discard.push(i); G.stats.kos++; if(G.stats.firstKOTurn==null)G.stats.firstKOTurn=G.turn;
  log(G,`${i.card.name} hat Feierabend! ${who(G,1-pi)} +${G.R.koPoints} Punkte.`,"sys");
  if(G.R.perks&&o.zweig==="WIR"&&draw(o,1)){G.stats.perkDraw++;log(G,`Doppelte Buchführung (Wirtschaft): ${who(G,1-pi)} zieht 1 Karte.`,1-pi);}
  trackLead(G);
}
function resolveKOs(G){const out=[];G.players.forEach((p,pi)=>inPlay(p).forEach(i=>{if(i.dmg>=i.card.hp){knockOut(G,pi,i);out.push(i);}}));return out;}
function gameOver(G,winner,reason){G.stats.deadSupports=G.players.reduce((s,p)=>s+p.hand.filter(x=>x.sup).length,0);G.over=true;G.busy=true;G.winner=winner;G.reason=reason||"";render(G);G.hooks.gameOver&&G.hooks.gameOver(G);return true;}
function checkWin(G){for(const pi of [G.cur,1-G.cur]) if(G.players[pi].points>=G.R.winPoints) return gameOver(G,pi);return false;}
async function promotions(G){
  if(checkWin(G)) return true;
  for(const pi of [1-G.cur,G.cur]){
    const p=G.players[pi];
    if(!p.active){
      const fromHand=!p.bench.length; const pool=fromHand?teachersIn(p.hand):p.bench;
      if(!pool.length){G.stats.endByNoTeacher++;return gameOver(G,1-pi,`${who(G,pi)}: keine Lehrkraft mehr, die nach vorn kann.`);}
      render(G);
      const t=await choose(G,pi,"Deine aktive Lehrkraft hat Feierabend. Wer kommt nach vorn?",pool.map(i=>({inst:i,score:hpLeft(i)+i.energy*20})));
      const src=fromHand?p.hand:p.bench; src.splice(src.indexOf(t),1); p.active=t; log(G,`${t.card.name} kommt nach vorn.`,pi);
      if(G.R.trostKaffee){t.energy+=G.R.trostKaffee;log(G,`Trost-Kaffee: ${t.card.name} bekommt ${G.R.trostKaffee} Kaffee.`,pi);}
      if(fromHand) await onPlay(G,pi,t);
    }
  }
  render(G); return false;
}

async function startGame(G){
  G.players.forEach((p,pi)=>{
    draw(p,G.R.startHand);
    while(!teachersIn(p.hand).length){p.deck.push(...p.hand);p.hand=[];shuffle(p.deck,G.rng);draw(p,G.R.startHand);G.stats.mulligans++;log(G,`${who(G,pi)} hat keine Lehrkraft auf der Hand und mischt neu.`,pi);}
  });
  // Neue Hand (Gwent): einmal entscheiden, ob man die ganze Starthand behält oder komplett neu zieht
  for(const pi of [0,1]){
    const p=G.players[pi]; let n=0;
    while(n<G.R.redraw&&p.deck.length){
      let x;
      if(isHuman(G,pi)){render(G);x=await choose(G,pi,"Deine Starthand: behalten oder komplett neu ziehen?",p.hand.map(i=>({inst:i,score:0})),{optional:"Hand behalten",action:"Neue Hand ziehen",view:true});}
      else x=aiRedrawPick(G,p);
      if(!x) break;
      const k=p.hand.length; p.deck.push(...p.hand); p.hand=[]; shuffle(p.deck,G.rng); draw(p,k); n++; G.stats.redraws++;
    }
    if(n) log(G,`${who(G,pi)} zieht eine neue Hand.`,pi);
    while(!teachersIn(p.hand).length){p.deck.push(...p.hand);p.hand=[];shuffle(p.deck,G.rng);draw(p,G.R.startHand);G.stats.mulligans++;log(G,`${who(G,pi)} hat keine Lehrkraft auf der Hand und mischt neu.`,pi);}
  }
  G.players.forEach((p,pi)=>{if(!isHuman(G,pi)){const t=teachersIn(p.hand).sort((a,b)=>b.card.hp-a.card.hp)[0];p.hand.splice(p.hand.indexOf(t),1);p.active=t;}});
  render(G);
  for(const hp of [0,1]){if(!isHuman(G,hp))continue;const p=G.players[hp];const t=await choose(G,hp,"Wähle deine erste aktive Lehrkraft",teachersIn(p.hand).map(i=>({inst:i,score:0})));p.hand.splice(p.hand.indexOf(t),1);p.active=t;}
  G.cur=G.starter=(G.forceStarter!=null?G.forceStarter:(G.rng()<.5?0:1));
  for(const pi of [0,1]){const p=G.players[pi];if(G.R.startEnergy)p.active.energy+=G.R.startEnergy;await onPlay(G,pi,p.active);}
  if(G.R.starterExtraCard){const k=draw(G.players[G.cur],G.R.starterExtraCard);if(k)log(G,`${who(G,G.cur)} zieht als Startspieler ${k} Karte extra.`,G.cur);}
  if(G.R.secondExtraCard){const k=draw(G.players[1-G.cur],G.R.secondExtraCard);if(k)log(G,`${who(G,1-G.cur)} zieht als zweiter Spieler ${k} Karte extra.`,1-G.cur);}
  if(G.R.secondStart){const p=G.players[1-G.cur];p.active.energy+=G.R.secondStart;log(G,`Frühstückskaffee: ${p.active.card.name} (${who(G,1-G.cur)}) startet mit ${G.R.secondStart} Kaffee.`,1-G.cur);}
  log(G,`Startspieler: ${who(G,G.cur)}.${G.R.firstTurnAttack?"":" Im allerersten Zug wird nicht angegriffen."}`,"sys");
  G.turn=1; await startTurn(G);
}
async function startTurn(G){
  const p=G.players[G.cur]; G.retreated=false; G.sel=null; G.supportsLeft=G.R.supportsPerTurn+((G.R.comebackSupport&&p.points<G.players[1-G.cur].points)?1:0)+(G.R.perks&&p.zweig==="WIR"?1:0); G.attachLeft=(G.turn===1&&G.R.firstTurnAttach!=null)?G.R.firstTurnAttach:G.R.attachPerTurn;
  log(G,`Zug ${G.turn} · ${who(G,G.cur)}`,"sys");
  if(G.R.examTurn&&G.turn===G.R.examTurn) log(G,`Prüfungsphase! Ab jetzt machen alle Attacken +${G.R.examBonus} Schaden.`,"sys");
  if(!(G.turn===1&&G.R.noFirstDraw)){
    if(!p.deck.length&&G.R.recycleSupports&&p.used.length){p.deck=shuffle(p.used,G.rng);p.used=[];log(G,`${who(G,G.cur)}: Ziehstapel leer, die gespielten Unterstützungskarten werden neu gemischt.`,G.cur);G.stats.recycled=(G.stats.recycled||0)+1;}
    if(!p.deck.length) G.stats.deckOut++; draw(p,1);
  }
  G.stats.benchThisTurn=0; G.benchLeft=G.R.benchPerTurn??99;
  if(G.R.firstTurnBench&&(G.turn===1||(G.turn===2&&!G.R.firstTurnBenchStarterOnly))) G.benchLeft=G.R.firstTurnBench;
  if(p.hand.length>G.stats.maxHand) G.stats.maxHand=p.hand.length;
  inPlay(p).forEach(i=>{if(i.card.passive?.key==="regen10"&&i.dmg>0){const h=Math.min(10,i.dmg);i.dmg-=h;log(G,`${i.card.name} heilt ${h} (${i.card.passive.name}).`,G.cur);}});
  if(!isHuman(G,G.cur)){G.busy=true;render(G);await aiTurn(G);}
  else {G.busy=false;render(G);}
}
async function endTurn(G){
  if(G.over) return;
  const p=G.players[G.cur];
  const g=p.bench.find(i=>i.card.passive?.key==="benchHeal");
  if(g&&p.active&&p.active.dmg>0){const h=Math.min(10,p.active.dmg);p.active.dmg-=h;log(G,`${g.card.name} heilt ${p.active.card.name} um ${h} (Seelsorge).`,G.cur);}
  if(G.R.perks&&p.zweig==="GES"&&p.active&&p.active.dmg>0&&p.active.card.subj==="GES"){const h=Math.min(G.R.healPerk,p.active.dmg);p.active.dmg-=h;G.stats.perkHeal+=h;log(G,`Fürsorge (Sozialwesen): ${p.active.card.name} heilt ${h}.`,G.cur);}
  G.noRetreat[G.cur]=false;
  if(G.turn>=G.R.maxTurns){gameOver(G,-1,"Zeit abgelaufen: unentschieden.");return;}
  G.turn++; G.cur=1-G.cur; G.busy=true;
  render(G); await sleep(G,250);
  await startTurn(G);
}

async function doAttack(G,pi,k){
  const me=G.players[pi],op=G.players[1-pi],a=me.active,atk=a.card.atks[k];
  G.busy=true;G.sel=null;
  spendKaffee(G,a,atk.cost);
  G.stats.attacks++; if(k===strongIdx(a)) G.stats.strong++;
  log(G,`${a.card.name} setzt „${atk.name}“ ein (${atk.cost} Energie verbraucht).`,pi); render(G); await sleep(G,350);
  const fx=atk.fx||[]; const has=t=>fx.find(f=>f.t===t); let f; const track=[];
  if(has("gust")&&op.bench.length){
    const t=await choose(G,pi,`${atk.name}: Welche gegnerische Lehrkraft holst du nach vorn?`,op.bench.map(i=>({inst:i,score:(calcDmg(G,a,i,baseDamage(G,pi,a,atk))>=hpLeft(i)?1000:0)-hpLeft(i)+i.energy*10})));
    swapActive(op,t); log(G,`${t.card.name} muss nach vorn.`,pi);
  }
  let r=null;
  if(atk.dice){r=1+Math.floor(G.rng()*6);}
  const dmg=baseDamage(G,pi,a,atk,r);
  if(atk.dice) log(G,`Gewürfelt: ${r}, also ${dmg} Schaden.`,pi);
  let target=op.active;
  if(has("snipe")) target=await choose(G,pi,`${atk.name}: Wen triffst du?`,inPlay(op).map(i=>({inst:i,score:(calcDmg(G,a,i,dmg)>=hpLeft(i)?1000+i.energy*20:0)-hpLeft(i)+(i===op.active?5:0)})));
  if(dmg>0&&target) dealDamage(G,pi,a,target,dmg,true,track);
  if(f=has("benchSplash")) op.bench.forEach(i=>dealDamage(G,pi,a,i,f.n,false,track));
  if(f=has("selfDmg")){a.dmg+=f.n;G.flash.add(a.uid);log(G,`${a.card.name} erhält ${f.n} Schaden durch den Rückstoß.`,pi);}
  if(f=has("healSelf")) heal(G,pi,a,f.n);
  if(f=has("healAll")) inPlay(me).forEach(i=>heal(G,pi,i,f.n));
  if(f=has("healOne")){const o=inPlay(me).filter(i=>i.dmg>0);if(o.length){const t=await choose(G,pi,`${atk.name}: Welche Lehrkraft heilst du?`,o.map(i=>({inst:i,score:Math.min(i.dmg,f.n)*10+(i===me.active?1:0)})));heal(G,pi,t,f.n);}}
  if(f=has("draw")){if(draw(me,f.n))log(G,`${who(G,pi)}: +${f.n} Karte.`,pi);}
  if(f=has("attachSelf")) addKaffee(G,pi,a,f.n,"helper");
  if((f=has("attachBench"))&&me.bench.length){const t=await choose(G,pi,`${atk.name}: Welche Lehrkraft auf deiner Bank bekommt 1 Energie?`,me.bench.map(i=>({inst:i,score:needScore(i)})));addKaffee(G,pi,t,f.n,"helper");}
  if(f=has("attachAny")){const t=await choose(G,pi,`${atk.name}: Welche Lehrkraft bekommt 2 Energie?`,inPlay(me).map(i=>({inst:i,score:needScore(i)})));addKaffee(G,pi,t,f.n,"helper");}
  if(has("noRetreat")){G.noRetreat[1-pi]=true;log(G,"Der Gegner darf seine aktive Lehrkraft nächsten Zug nicht auswechseln.",pi);}
  if((f=has("strip"))&&op.active&&op.active.energy){const n=Math.min(f.n,op.active.energy);op.active.energy-=n;log(G,`${op.active.card.name} verliert ${n} Energie.`,pi);}
  const front=op.active;
  render(G); await sleep(G,500);
  const ko=resolveKOs(G);
  track.forEach(t=>{if(t.before===0&&ko.includes(t.tgt)){G.stats.oneShots++;if(!inExam(G))G.stats.oneShotsEarly++;}});
  if((f=has("drawOnKO"))&&ko.includes(front)){if(draw(me,f.n))log(G,`${atk.name}: ${who(G,pi)} +${f.n} Karten.`,pi);}
  if(await promotions(G)) return;
  if(has("forceSwitch")&&op.active===front&&op.bench.length){
    const t=await choose(G,1-pi,`${atk.name}: Welche deiner Lehrkräfte kommt nach vorn?`,op.bench.map(i=>({inst:i,score:hpLeft(i)+i.energy*15})));
    swapActive(op,t);log(G,`${t.card.name} muss nach vorn.`,pi);
  }
  if(has("freeSwitch")&&me.active===a&&me.bench.length&&!G.noRetreat[pi]){
    const low=hpLeft(a)<=40;
    const t=await choose(G,pi,`${atk.name}: Mit wem tauschst du?`,me.bench.map(i=>({inst:i,score:hpLeft(i)+i.energy*10})),{optional:"Nicht tauschen",aiSkip:!low});
    if(t){swapActive(me,t);log(G,`${t.card.name} wechselt nach vorn.`,pi);}
  }
  render(G); await sleep(G,300);
  await endTurn(G);
}

/* ---------- Zweig-Joker (Anführer, 1× pro Spiel) ---------- */
const jokerOf=p=>ZWEIGE[p.zweig].joker;
function canJoker(G,pi){
  const p=G.players[pi],op=G.players[1-pi];
  if(!G.R.jokers||G.cur!==pi||G.over||p.jokerUsed||G.turn<G.R.jokerFromTurn||!p.active) return false;
  const f=jokerOf(p).fx;
  if(f==="jGust") return op.bench.some(i=>!hero(i));
  if(f==="jHealAll") return inPlay(p).some(i=>i.dmg>0);
  return true;
}
async function playJoker(G,pi){
  if(!canJoker(G,pi)) return false;
  const p=G.players[pi],op=G.players[1-pi],J=jokerOf(p);
  p.jokerUsed=true; G.stats.jokers++; G.stats.jokerTurn.push(G.turn);
  log(G,`${who(G,pi)} setzt den Zweig-Joker „${J.name}“ ein!`,pi);
  if(J.fx==="jAttach2"){const t=await choose(G,pi,`${J.name}: Wer bekommt 2 Energie?`,inPlay(p).map(x=>({inst:x,score:needScore(x)+(x===p.active?3:0)})));addKaffee(G,pi,t,2,"joker");}
  if(J.fx==="jInvest"){inPlay(p).forEach(t=>addKaffee(G,pi,t,1,"joker"));if(draw(p,1))log(G,`${who(G,pi)}: +1 Karte.`,pi);}
  if(J.fx==="jGust"){const t=await choose(G,pi,`${J.name}: Wen holst du nach vorn?`,op.bench.filter(i=>!hero(i)).map(i=>({inst:i,score:gustScore(G,pi,i)})));swapActive(op,t);log(G,`${t.card.name} muss nach vorn.`,pi);}
  if(J.fx==="jHealAll") inPlay(p).forEach(i=>heal(G,pi,i,G.R.jokerHeal));
  render(G); return true;
}
// Wie viel bringt es, diese gegnerische Lehrkraft nach vorn zu holen?
function gustScore(G,pi,t){
  const a=G.players[pi].active; if(!a) return 0;
  const en=a.energy+(G.cur===pi?G.attachLeft:0);
  const best=Math.max(0,...a.card.atks.filter(x=>x.cost<=en&&!x.dice).map(x=>calcDmg(G,a,t,baseDamage(G,pi,a,x,null))));
  return (best>=hpLeft(t)?100+t.energy*10:0)+best-hpLeft(t)*.3;
}
function aiJokerScore(G,pi){
  if(!canJoker(G,pi)) return -1;
  const p=G.players[pi],op=G.players[1-pi],a=p.active,f=jokerOf(p).fx;
  const need=x=>Math.max(0,strongCost(x)-x.energy);
  if(f==="jAttach2") return need(a)>=1&&G.attachLeft===0?30:need(a)>=2?30:p.bench.some(x=>need(x)>=2)&&G.turn>=6?16:0;
  if(f==="jInvest"){const n=inPlay(p).filter(x=>need(x)>0).length;return n>=3?32:n>=2&&G.turn>=8?26:G.turn>=14&&n?18:0;}
  if(f==="jHealAll"){const h=inPlay(p).reduce((s,i)=>s+Math.min(G.R.jokerHeal,i.dmg),0);return h>=40||(hpLeft(a)<=30&&a.dmg>=20)?32:G.turn>=14&&h>=20?18:0;}
  if(f==="jGust"){const b=Math.max(...op.bench.filter(i=>!hero(i)).map(i=>gustScore(G,pi,i)));return b>=100?40:G.turn>=16&&b>0?18:0;}
  return 0;
}
function aiRedrawPick(G,p){
  // Neue Hand nur, wenn höchstens 1 Lehrkraft dabei ist (Rückgabe: irgendeine Handkarte = neu ziehen, null = behalten)
  return teachersIn(p.hand).length<2?p.hand[0]||null:null;
}

/* ---------- Computergegner ---------- */
function aiValue(G,pi,a,atk){
  const me=G.players[pi],op=G.players[1-pi];
  const fx=atk.fx||[]; const has=t=>fx.find(f=>f.t===t); let f;
  const d=baseDamage(G,pi,a,atk,null);
  let v=0,kills=false;
  const hit=i=>{const x=calcDmg(G,a,i,d);const k=d>0&&x>=hpLeft(i);return {x:x+(k?60:0),k};};
  let pool=[op.active];
  if(has("snipe")||(has("gust")&&op.bench.length)) pool=inPlay(op);
  if(op.active){const best=pool.filter(Boolean).map(hit).sort((x,y)=>y.x-x.x)[0];v=best.x;kills=best.k;}
  if(f=has("selfDmg")) v-=f.n>=hpLeft(a)?90:f.n*.4;
  if(f=has("healSelf")) v+=Math.min(a.dmg,f.n)*.7;
  if(f=has("healAll")) v+=inPlay(me).reduce((s,i)=>s+Math.min(i.dmg,f.n),0)*.6;
  if(f=has("healOne")) v+=Math.max(0,...inPlay(me).map(i=>Math.min(i.dmg,f.n)))*.7;
  if(f=has("benchSplash")) v+=f.n*op.bench.length*.8;
  if((f=has("strip"))&&op.active) v+=Math.min(f.n,op.active.energy)*14;
  if(has("draw")) v+=5;
  if(f=has("attachSelf")||has("attachAny")) v+=14*f.n;
  if((f=has("attachBench"))&&me.bench.length) v+=14*f.n;
  if(has("noRetreat")||has("forceSwitch")) v+=4;
  return {v,kills};
}
function aiPickAttack(G,pi){
  const a=G.players[pi].active; if(!a) return -1;
  const sk=strongIdx(a), strong=a.card.atks[sk];
  const opts=a.card.atks.map((atk,k)=>({k,atk})).filter(o=>canAttack(G,pi,o.k)).map(o=>Object.assign(o,aiValue(G,pi,a,o.atk)));
  if(!opts.length) return -1;
  opts.sort((x,y)=>y.v-x.v);
  const best=opts[0], en=a.energy, gain=G.R.attachPerTurn;
  if(best.k!==sk&&en<strong.cost&&!best.kills){
    const refund=(best.atk.fx||[]).find(f=>f.t==="attachSelf")?.n||0;
    const stillStrongNext=en-best.atk.cost+refund+gain>=strong.cost;
    const reachIfWait=en+gain>=strong.cost;
    if(!stillStrongNext&&reachIfWait){const sv=aiValue(G,pi,a,strong).v;if(sv>=2*best.v+(G.R.aiSaveMargin||0)) return -1;}
  }
  return best.v>0?best.k:-1;
}
function aiAttachTarget(G,pi){
  const me=G.players[pi]; const a=me.active;
  if(G.turn===1&&G.R.firstAttachBenchOnly) return me.bench.slice().sort((x,y)=>strongCost(x)-strongCost(y))[0]||null;
  // Vorladen: Fällt der aktive Lehrer wahrscheinlich im nächsten gegnerischen Zug und kann er schon angreifen, Kaffee auf die Bank
  if(G.R.aiPreload&&a&&a.energy>=1&&me.bench.length){

<script>
/* Lehrerzimmer – Online-Partie im Gleichschritt (Lockstep)
   Beide Geräte rechnen dieselbe Engine mit demselben Startwert. Übertragen werden nur Züge,
   positionsbasiert (Handindex, Zone, Auswahlindex) und fortlaufend nummeriert (n).
   Der Transport (db + room) liefert Züge in beliebiger Reihenfolge an push(); hier werden sie geordnet. */
const Lockstep=(()=>{
function rngFrom(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* cfg: {decks:[d0,d1], zweig:[z0,z1], seed, names:[a,b], me}
   ui:  {askChoice(title,options,opt) -> Promise<index|-1>, onRender(M), onOver(M), sleep(ms)} */
function createMatch(E,cfg,ui={}){
  const known=new Map(); let cursor=0; const waiters=[];
  const M={me:cfg.me,G:null,inFlight:false,resigned:null,sent:0,send:null,error:null};
  M.count=()=>{let n=0;while(known.has(n))n++;return n;};
  M.push=m=>{if(!m||typeof m.n!=="number"||known.has(m.n))return;known.set(m.n,m);flush();};
  // Beim Wiederverbinden liegen schon Züge bereit: dann ohne Pausen nachspielen
  M.behind=()=>known.has(cursor);
  M.moves=()=>{const a=[];for(let n=0;known.has(n);n++)a.push(known.get(n));return a;};
  function flush(){while(waiters.length&&known.has(cursor)){const m=known.get(cursor++);waiters.shift()(m);}}
  const next=()=>new Promise(r=>{waiters.push(r);flush();});
  // Lokalen Zug abschicken: Nummer = nächste freie Stelle
  M.act=m=>{if(!M.send||M.inFlight)return false;M.inFlight=true;const mv=Object.assign({n:M.count(),p:M.me},m);M.send(mv);return true;};
  const hooks={
    render:()=>ui.onRender&&ui.onRender(M),
    sleep:ms=>M.behind()?Promise.resolve():ui.sleep?ui.sleep(ms):Promise.resolve(),
    choose:async(G,title,options,opt,pi)=>{
      if(pi===M.me&&ui.askChoice&&!known.has(cursor)) ui.askChoice(title,options,opt||{}).then(i=>{const mv={n:M.count(),p:pi,t:"choice",i:i==null?-1:i};M.send&&M.send(mv);});
      for(;;){
        const m=await next();
        if(m.t==="resign"){M.resigned=m.p;throw "resigned";}
        if(m.t==="choice"&&m.p===pi){
          if(m.i>=0&&m.i<options.length) return options[m.i].inst;
          return opt&&opt.optional?null:options[0].inst;
        }
      }
    },
    gameOver:()=>ui.onOver&&ui.onOver(M)
  };
  M.G=E.createGame(cfg.decks[0],cfg.decks[1],hooks,{rng:rngFrom(cfg.seed),human:[0,1],names:cfg.names||["Spieler 1","Spieler 2"],zweig:cfg.zweig});
  const inst=(p,z)=>z==="a"?p.active:p.bench[z];
  async function apply(m){
    const G=M.G,pi=m.p,p=G.players[pi];
    if(m.t==="bench"){const i=p.hand[m.h];if(i&&E.canBench(G,pi,i))await E.benchFromHand(G,pi,i);}
    else if(m.t==="sup"){const i=p.hand[m.h];if(i&&E.canPlaySupport(G,pi,i))await E.playSupport(G,pi,i);}
    else if(m.t==="attach"){const i=inst(p,m.z);if(i&&E.canAttach(G,pi,i))E.attach(G,pi,i);}
    else if(m.t==="atk"){if(E.canAttack(G,pi,m.k))await E.doAttack(G,pi,m.k);}
    else if(m.t==="retreat"){const t=p.bench[m.b];if(t&&E.canRetreat(G,pi))E.doRetreat(G,pi,t);}
    else if(m.t==="joker"){if(E.canJoker(G,pi))await E.playJoker(G,pi);}
    else if(m.t==="end"){E.log(G,`${G.names[pi]} beendet den Zug.`,pi);await E.endTurn(G);}
  }
  function resignEnd(p){const G=M.G;if(G.over)return;G.over=true;G.busy=true;G.winner=1-p;G.reason=`${G.names[p]} hat aufgegeben.`;hooks.render();hooks.gameOver();}
  M.run=async()=>{
    try{
      await E.startGame(M.G);
      while(!M.G.over){
        const m=await next();
        if(m.t==="resign"){M.resigned=m.p;resignEnd(m.p);break;}
        if(m.t!=="choice"&&m.p===M.G.cur&&!M.G.over) await apply(m);
        if(m.p===M.me) M.inFlight=false;
        hooks.render();
      }
    }catch(e){
      if(e==="resigned") resignEnd(M.resigned);
      else if(e!=="abort"){M.error=e;throw e;}
    }

  M.myTurn=()=>M.G.cur===M.me&&!M.G.busy&&!M.G.over&&!M.inFlight&&!known.has(cursor);
  return M;
}
/* Zustand für den Vergleich zweier Geräte */
function fingerprint(G){
  const t=i=>i?`${i.card.id}:${i.dmg}:${i.energy}`:"-";
  return JSON.stringify({turn:G.turn,cur:G.cur,over:G.over,winner:G.winner,pl:G.players.map(p=>({pts:p.points,a:t(p.active),b:p.bench.map(t),h:p.hand.map(i=>i.card?i.card.id:i.sup.id),d:p.deck.length,x:p.discard.map(i=>i.card.id),j:p.jokerUsed}))});

const E=Engine;

/* ---------- Perspektive ---------- */
function adj(m){return [m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]];}
function mm(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s;}return c;}
function mv(m,v){return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];}
function basis(p){const m=[p[0][0],p[1][0],p[2][0],p[0][1],p[1][1],p[2][1],1,1,1];const v=mv(adj(m),[p[3][0],p[3][1],1]);return mm(m,[v[0],0,0,0,v[1],0,0,0,v[2]]);}

const Game=(()=>{
/* ---------- Zustand ---------- */

function reset(){selHand=selField=null;armed=false;lastLog=null;prevDmg=new Map();prevField=new Map();prevEn=new Map();handSig="";dockSig="";lastCur=-1;$("field").innerHTML="";$("fx").innerHTML="";logOpen=false;actBusy=false;ended=false;closeAll();$("over")?.remove();$("confirm")?.remove();$("logbox")?.remove();}

/* Gegen den Computer */
function startAI(deck,zweig){

/* Online: cfg {decks,zweig,seed,names,me}, net {send(m), close()} */
function startOnline(cfg,net){

function act(m){

function layout(){

const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36);};

// Zeichnen im nächsten Frame; falls der Browser keine Frames liefert (Hintergrund), spätestens nach 60 ms
function render(){if(rq)return;let done=false;const go=()=>{if(done)return;done=true;rq=0;try{draw();}catch(e){console.error(e);}};rq=1;requestAnimationFrame(go);setTimeout(go,60);}
function sync(parent,items){
  const have=new Map([...parent.children].map(el=>[el.dataset.k,el])),keep=new Set();
  for(const it of items){
    let el=have.get(it.key);
    if(!el||el.dataset.h!==it.hash){const t=document.createElement("div");t.innerHTML=it.html.trim();const n=t.firstElementChild;n.dataset.k=it.key;n.dataset.h=it.hash;if(el)el.replaceWith(n);else parent.appendChild(n);el=n;}
    if(it.tf&&el.style.transform!==it.tf) el.style.transform=it.tf;
    keep.add(it.key);
  }
  have.forEach((el,k)=>{if(!keep.has(k))el.remove();});
}
const tfOf=q=>quadMatrix(160,223,px(q));
function draw(){
  if(!$("stage")||!G) return;

    const mine=pi===ME;

      if(slot==="active"&&G.noRetreat[pi]) html=html.replace('<span class="en">','<span class="lock">Kein Rückzug</span><span class="en">');
      items.push({key:"c"+i.uid,html,hash:hs(html),tf:tfOf(q)});now.set(i.uid,{slot,pi,html,tf:tfOf(q)});};
    if(p.active) add(p.active,"active");
    p.bench.forEach((b,k)=>add(b,"bench"+k));
    if(p.deck.length){const h=backHTML(p.deck.length);items.push({key:"d"+pi,html:h,hash:hs(h),tf:tfOf(Z(pi,"deck"))});}
    if(p.discard.length){const top=p.discard[p.discard.length-1];
      const h=fieldHTML(top," dead").replace(/ data-uid="\d+"/,"").replace(' tabindex="0" role="button"','').replace('<span class="en">',`<span class="badge">${p.discard.length}× Feierabend</span><span class="en">`);
      items.push({key:"x"+pi,html:h,hash:hs(h),tf:tfOf(Z(pi,"discard"))});}
    if(hasZ(pi,"zweig")){const h=zweigHTML(p);items.push({key:"z"+pi,html:h,hash:hs(h),tf:tfOf(Z(pi,"zweig"))});}
  });

  // Feierabend: alte Karte blendet aus
  prevField.forEach((v,uid)=>{if(!now.has(uid)&&G.players.some(p=>p.discard.some(d=>d.uid===uid))){const t=document.createElement("div");t.innerHTML=v.html;const el=t.firstElementChild;el.style.transform=v.tf;el.classList.add("gone");el.removeAttribute("data-uid");$("fx").appendChild(el);setTimeout(()=>el.remove(),800);}});
  // Schaden, Heilung und Energie als fliegende Zahlen

    const d0=prevDmg.get(i.uid);if(d0!=null&&d0!==i.dmg&&v)floatNum(Z(v.pi,v.slot),i.dmg-d0);prevDmg.set(i.uid,i.dmg);
    const e0=prevEn.get(i.uid);if(e0!=null&&i.energy>e0&&v)floatEnergy(Z(v.pi,v.slot),i.energy-e0);prevEn.set(i.uid,i.energy);}));
  prevField=now;
  // Ablageziel für Lehrkräfte aus der Hand
  const slots=[];const dragT=dragHand!=null?me().hand.find(x=>x.uid===dragHand):null,selT=selHand!=null?me().hand.find(x=>x.uid===selHand):null;
  const benchHint=(dragT&&dragT.card)||(selT&&selT.card);

}

}

    const w=document.createElement("div");w.className="mwrap";w.id="modal";const sc=L()?0.78:0.62;

function endDrag(e){

/* ---------- Profil: privat pro Person in db, sonst im Browser ---------- */
const Profile=(()=>{
  let LS="lza-profil-v1";
  let data=null,doc=null,writing=false,again=false;
  const today=()=>new Date().toISOString().slice(0,10);
  // Neues Profil: nur das Startdeck des gewählten Zweigs gehört dir, alles andere kommt aus Packs
  function base(zweig="MINT"){
    const t={};RECOMMENDED_Z[zweig].forEach(id=>t[id]=1);
    const sup={};RECOMMENDED_Z_SUPPORTS.forEach(id=>sup[id]=(sup[id]||0)+1);
    return {v:2,zweig,coll:{t,s:{},sup,e:{kaffee:1}},
      decks:[{id:"start-"+zweig,name:"Startdeck "+ZWEIGE[zweig].name.split(" ")[0],zweig,ids:RECOMMENDED_Z[zweig].concat(RECOMMENDED_Z_SUPPORTS),start:true}],
      active:"start-"+zweig,packs:{day:"",free:0,bonus:1,opened:0},stats:{w:0,l:0,ow:0,ol:0},best:[],cur:null};
  }
  function fix(d){const b=base(d&&d.zweig||"MINT");d=Object.assign(b,d||{});d.coll=Object.assign(b.coll,d.coll||{});["t","s","sup","e"].forEach(k=>d.coll[k]=d.coll[k]||{});d.packs=Object.assign(base().packs,d.packs||{});d.stats=Object.assign(base().stats,d.stats||{});if(!Array.isArray(d.decks)||!d.decks.length)d.decks=b.decks;return d;}
  // liefert null, wenn es für diese Person noch kein Profil gibt (dann Zweig wählen)
  async function init(db,uid){
    LS="lza-profil-v2-"+(uid||"lokal");doc=null;
    const local=store.get(LS);data=local?fix(local):null;
    if(db&&uid){
      try{doc=db.collection("data/users/"+uid).doc("profil");const s=await doc.get();
        if(s.exists) data=fix(JSON.parse(JSON.stringify(s.data()))); else if(data) await doc.set(data);}catch(e){doc=null;}
    }
    if(data) daily(); return data;
  }
  function create(zweig){data=base(zweig);daily();save();return data;}
  function daily(){if(data.packs.day!==today()){data.packs.day=today();data.packs.free=2;save();}}
  async function flushDb(){if(!doc)return;if(writing){again=true;return;}writing=true;try{await doc.set(JSON.parse(JSON.stringify(data)));}catch(e){}writing=false;if(again){again=false;flushDb();}}
  let t=null;
  function save(){store.set(LS,data);clearTimeout(t);t=setTimeout(flushDb,400);}
  const owns=id=>(data.coll.t[id]||0)+(data.coll.s[id]||0)>0;
  const supOwned=id=>data.coll.sup[id]||0;
  function deckIssues(d){
    const p=E.deckProblems(d.ids,d.zweig);
    const miss=d.ids.filter(id=>byId(id)&&!owns(id));
    if(miss.length) p.push(`Nicht in deiner Sammlung: ${miss.map(id=>byId(id).name).join(", ")}.`);
    SUPPORTS.forEach(s=>{const n=d.ids.filter(x=>x===s.id).length;if(n>supOwned(s.id))p.push(`„${s.name}“ besitzt du nur ${supOwned(s.id)}×.`);});
    return p;
  }
  async function flush(){clearTimeout(t);store.set(LS,data);if(doc){try{await doc.set(JSON.parse(JSON.stringify(data)));}catch(e){}}}
  return {init,create,save,flush,daily,get:()=>data,owns,supOwned,deckIssues,synced:()=>!!doc};
})();

/* ---------- Packs ---------- */
const PACK={teacherSlots:3,lucky:[["teacher",38],["energyCommon",33],["energyUncommon",10],["energyRare",6],["energyGold",1],["legend",4],["shiny",7],["shinyLegend",1]]};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function openPack(){
  const P=Profile.get(),album=P.coll;
  const normal=CARDS.filter(c=>!c.legend),legends=CARDS.filter(c=>c.legend);
  const ids=E.shuffle(normal.map(c=>c.id)).slice(0,PACK.teacherSlots);
  const out=ids.map(id=>({k:"t",id}));
  out.push({k:"sup",id:rnd(SUPPORTS).id});
  let r=Math.random()*100,L="teacher";for(const [k,w] of PACK.lucky){if((r-=w)<0){L=k;break;}}
  if(L==="teacher") out.push({k:"t",id:rnd(normal.filter(c=>!ids.includes(c.id))).id});
  else if(L==="legend") out.push({k:"t",id:rnd(legends).id,tag:"Legendär!"});
  else if(L==="shiny") out.push({k:"s",id:rnd(normal).id,tag:"Shiny!"});
  else if(L==="shinyLegend") out.push({k:"s",id:rnd(legends).id,tag:"Shiny-Legendär!!"});
  else {const rar={energyCommon:"Gewöhnlich",energyUncommon:"Ungewöhnlich",energyRare:"Selten",energyGold:"Ultra-selten"}[L];
    out.push({k:"e",id:rnd(ENERGIES.filter(e=>e.rarity===rar)).id,tag:rar==="Ultra-selten"?"Ultra-selten!":rar==="Selten"?"Selten":null});}
  out.forEach(x=>{x.isNew=!album[x.k][x.id];album[x.k][x.id]=(album[x.k][x.id]||0)+1;});
  P.packs.opened++;
  out.filter(x=>x.tag&&x.tag!=="Selten").forEach(x=>{P.best.unshift({k:x.k,id:x.id,tag:x.tag,pack:P.packs.opened});P.best=P.best.slice(0,8);});
  Profile.save(); return out;
}
